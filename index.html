<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vantor</title>
<meta name="description" content="Vantor: your personal command center for habits, money, training, trading and growth.">
<meta name="theme-color" content="#0F0F0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vantor">
<link rel="manifest" href="manifest.webmanifest">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js"></script>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>html,body{margin:0}</style>
<style>
/* Layout: a personal instrument. Physical modules on a graphite chassis, one signal orange, expanded grotesk numerals, mono silkscreen labels. Bento grid on Today. */
:root{
  --bg:#0F0F0F; --chassis:#151515; --surface:#1B1B1B; --surface-2:#232323; --raise:#2C2C2C; --ink:#F3F1EC; --muted:#93918B; --faint:#5C5B57; --line:#262626; --line-2:#363636;
  --moss:#FF5B1F; --amber:#FFC21A; --sky:#4F8DFF; --lingon:#FF5C93; --heather:#A47BFF; --sand:#35D08A;
  --neg:#FF5D5D; --pos:#35D08A; --on-accent:#140C08; --glow:color-mix(in oklab,var(--moss) 45%,transparent);
  --hi:rgb(255 255 255 / .06); --sh:rgb(0 0 0 / .55);
  --f-display:"Archivo", "Helvetica Neue", Arial, sans-serif; --f-body:"Archivo", "Helvetica Neue", Arial, sans-serif; --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:18px; --r-sm:12px; color-scheme:dark;
}
:root[data-skin="bone"]{
  --bg:#E6E2DA; --chassis:#DDD8CF; --surface:#F3F0EA; --surface-2:#E9E5DD; --raise:#FFFFFF; --ink:#171614; --muted:#6D6A64; --faint:#A29E97; --line:#D6D1C7; --line-2:#C5BFB3;
  --moss:#F24E12; --amber:#E0A400; --sky:#2F6FE8; --lingon:#E23E78; --heather:#7C55E6; --sand:#16A86A; --neg:#D93B3B; --pos:#16A86A; --on-accent:#FFF8F2;
  --hi:rgb(255 255 255 / .8); --sh:rgb(70 55 35 / .18); color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px));padding-block:0 72px;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 1px 1px, color-mix(in oklab,var(--ink) 7%,transparent) 1px, transparent 0);background-size:22px 22px;background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--moss);outline-offset:3px}
::selection{background:color-mix(in oklab,var(--moss) 45%,transparent)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{text-wrap:balance;margin:0}
.cap::first-letter{text-transform:uppercase}
.muted{color:var(--muted)}
.empty-note{color:var(--muted);font-size:.88rem;margin:6px 0 0;max-width:62ch}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.view{display:flex;flex-direction:column;gap:18px}
.grow{flex:1}
.label,.eyebrow{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;font-weight:500;color:var(--muted);margin:0}
.eyebrow{color:var(--moss)}
.serif,.xp{font-family:var(--f-display);font-stretch:125%;font-weight:800;letter-spacing:-.02em}

/* custom cursor */
@media (hover:hover) and (pointer:fine){
  html.cursor-on, html.cursor-on body, html.cursor-on button, html.cursor-on a, html.cursor-on label, html.cursor-on [data-act]{cursor:none}
  html.cursor-on input:not([type=checkbox]):not([type=radio]):not([type=range]), html.cursor-on textarea, html.cursor-on select{cursor:text}
}
.cur-dot,.cur-ring{position:fixed;left:0;top:0;pointer-events:none;z-index:300;border-radius:50%;will-change:transform}
.cur-dot{width:8px;height:8px;margin:-4px 0 0 -4px;background:var(--moss)}
.cur-ring{width:38px;height:38px;margin:-19px 0 0 -19px;border:1.5px solid var(--ink);mix-blend-mode:difference;transition:width .25s cubic-bezier(.2,.8,.2,1),height .25s cubic-bezier(.2,.8,.2,1),margin .25s cubic-bezier(.2,.8,.2,1),background .25s,border-color .25s,opacity .2s;display:grid;place-items:center}
.cur-ring.hov{width:62px;height:62px;margin:-31px 0 0 -31px;background:color-mix(in oklab,#fff 92%,transparent);border-color:transparent}
.cur-ring.down{width:28px;height:28px;margin:-14px 0 0 -14px}
.cur-ring.txt{opacity:0}
.cur-ring span{font-family:var(--f-mono);font-size:9px;letter-spacing:.06em;color:#000;text-transform:uppercase;font-weight:600;white-space:nowrap;mix-blend-mode:normal}
.ripple{position:fixed;pointer-events:none;z-index:299;border-radius:50%;border:1.5px solid var(--moss);width:10px;height:10px;margin:-5px 0 0 -5px;animation:rip .55s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rip{to{transform:scale(7);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:280}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px 24px;padding-block:16px 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:40}
.top::before{content:"";position:absolute;inset:0 calc(-1 * max(18px, env(safe-area-inset-left, 0px)));background:color-mix(in oklab,var(--bg) 82%,transparent);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--line);z-index:-1}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink)}
.brand svg{width:34px;height:34px;flex:none;filter:drop-shadow(0 6px 14px var(--glow))}
.wordmark{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:1.25rem;letter-spacing:-.03em}
.clock{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.04em;padding:6px 10px;border-radius:999px;background:var(--surface);box-shadow:inset 0 1px 0 var(--hi),0 0 0 1px var(--line)}
.clock b{color:var(--moss);font-weight:500}
.tabs{position:relative;display:flex;gap:2px;padding:5px;border-radius:999px;background:var(--chassis);box-shadow:inset 0 2px 6px var(--sh),0 0 0 1px var(--line)}
.tabs .ind{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:999px;background:var(--raise);box-shadow:inset 0 1px 0 var(--hi),0 4px 12px var(--sh);transition:transform .45s cubic-bezier(.2,.9,.2,1),width .45s cubic-bezier(.2,.9,.2,1);z-index:0}
.tabs button{position:relative;z-index:1;border:0;background:none;padding:9px 15px;border-radius:999px;font-size:.84rem;font-weight:600;color:var(--muted);transition:color .25s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs svg{display:none}
.me{display:flex;align-items:center;gap:10px}
.sync{display:flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync[data-s="ok"] i{background:var(--pos);box-shadow:0 0 8px var(--pos)} .sync[data-s="saving"] i{background:var(--amber);box-shadow:0 0 8px var(--amber)} .sync[data-s="err"] i{background:var(--neg)}
.avatar{width:40px;height:40px;border-radius:50%;border:0;background:linear-gradient(160deg,var(--raise),var(--surface));box-shadow:inset 0 1px 0 var(--hi),0 4px 12px var(--sh),0 0 0 1px var(--line-2);color:var(--ink);font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:.9rem;display:grid;place-items:center;flex:none;padding:0}
.avatar.lg{width:68px;height:68px;font-size:1.4rem}
.avatar.sm{width:26px;height:26px;font-size:.62rem}
.more-btn{display:none}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 18px;border-radius:var(--r);padding:14px 18px;font-size:.9rem;background:repeating-linear-gradient(135deg,color-mix(in oklab,var(--moss) 10%,var(--surface)) 0 14px,var(--surface) 14px 28px);box-shadow:0 0 0 1px color-mix(in oklab,var(--moss) 35%,var(--line))}
.banner p{margin:0;max-width:72ch;color:var(--muted)}
.banner strong{color:var(--ink)}

/* page heads */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 18px;padding-top:8px}
.page-head h2{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:clamp(2rem,5vw,3.2rem);line-height:.95;letter-spacing:-.04em}
.page-head h2 .muted{font-weight:500}
.page-head .sub{font-family:var(--f-mono);color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em}
.page-head .actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.navarrows{display:flex;gap:6px;align-items:center}
.hello{padding-top:10px;display:flex;flex-direction:column;gap:8px}
.hello h2{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:clamp(2.3rem,6.4vw,4.6rem);line-height:.92;letter-spacing:-.045em}
.hello h2 em{font-style:normal;color:var(--moss)}
.hello .motto{margin:0;color:var(--muted);font-size:1.02rem;max-width:62ch}
.identity{font-size:1rem;color:var(--ink);margin:0;opacity:.85}

/* ticker */
.ticker{overflow:hidden;border-radius:999px;background:var(--chassis);box-shadow:inset 0 2px 6px var(--sh),0 0 0 1px var(--line);padding:9px 0;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.ticker .tk-in{display:flex;gap:40px;width:max-content;animation:marq 48s linear infinite;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.ticker .tk-in span::before{content:"●";color:var(--moss);margin-right:12px;font-size:.6rem;vertical-align:1px}
.ticker:hover .tk-in{animation-play-state:paused}
@keyframes marq{to{transform:translateX(-50%)}}

/* controls */
.icon-btn{width:38px;height:38px;border-radius:50%;border:0;background:linear-gradient(160deg,var(--raise),var(--surface));box-shadow:inset 0 1px 0 var(--hi),0 3px 10px var(--sh),0 0 0 1px var(--line-2);display:grid;place-items:center;flex:none;padding:0;color:var(--ink);transition:transform .15s}
.icon-btn:active{transform:translateY(1px) scale(.97)}
.icon-btn.sm{width:30px;height:30px}
.icon-btn.sm svg{width:12px;height:12px}
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:600;font-size:.84rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;color:var(--ink);background:linear-gradient(170deg,var(--raise),var(--surface-2));box-shadow:inset 0 1px 0 var(--hi),0 4px 12px var(--sh),0 0 0 1px var(--line-2);transition:transform .15s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background .2s}
.btn:hover{box-shadow:inset 0 1px 0 var(--hi),0 6px 18px var(--sh),0 0 0 1px var(--faint)}
.btn:active{transform:translateY(1px) scale(.98);box-shadow:inset 0 2px 6px var(--sh),0 0 0 1px var(--line-2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary,.btn.accent{color:var(--on-accent);background:linear-gradient(170deg,color-mix(in oklab,var(--moss) 82%,#fff),var(--moss) 55%,color-mix(in oklab,var(--moss) 85%,#000));box-shadow:inset 0 1px 0 rgb(255 255 255 / .35),0 8px 22px -6px var(--glow),0 0 0 1px color-mix(in oklab,var(--moss) 70%,#000)}
.btn.primary:hover,.btn.accent:hover{box-shadow:inset 0 1px 0 rgb(255 255 255 / .35),0 12px 28px -6px var(--glow),0 0 0 1px color-mix(in oklab,var(--moss) 70%,#000)}
.btn.small{padding:7px 12px;font-size:.76rem}
.btn.lg{padding:15px 26px;font-size:.92rem}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted);padding-inline:8px}
.btn.ghost:hover{color:var(--ink);box-shadow:none}
.linkbtn{border:0;background:none;color:var(--moss);font-weight:600;padding:4px 0;font-size:.86rem}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}
.linkbtn.quiet{color:var(--muted)}
.del{border:0;background:none;color:var(--faint);opacity:0;padding:0 4px;font-size:1.1rem;line-height:1;transition:opacity .2s,color .2s}
.del:hover{color:var(--neg)}
*:hover>.del,.del:focus-visible{opacity:1}
@media (hover:none){.del{opacity:.7}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:0;border-radius:999px;padding:8px 13px;font-size:.82rem;color:var(--muted);background:var(--surface-2);box-shadow:0 0 0 1px var(--line-2);transition:all .2s}
.chips button:hover{color:var(--ink)}
.chips button[aria-pressed="true"]{color:var(--on-accent);background:var(--moss);box-shadow:0 6px 16px -6px var(--glow)}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--chassis);box-shadow:inset 0 2px 5px var(--sh),0 0 0 1px var(--line)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:.74rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{color:var(--ink);background:var(--raise);box-shadow:inset 0 1px 0 var(--hi),0 2px 6px var(--sh)}

/* modules */
.card,.panel,.day,.gcard,.brief,.promo,.hero{background:linear-gradient(175deg,var(--surface),color-mix(in oklab,var(--surface) 92%,var(--bg)));border-radius:var(--r);box-shadow:inset 0 1px 0 var(--hi),0 1px 0 var(--line) inset,0 14px 34px -18px var(--sh),0 0 0 1px var(--line);padding:22px;min-width:0;position:relative}
.panel{padding:22px}
.card h3,.panel h3{font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:1.12rem;letter-spacing:-.01em;margin:0 0 16px;display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.card h3::before,.panel h3::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--led,var(--faint));box-shadow:0 0 8px var(--led,transparent);flex:none}
.led-on{--led:var(--pos)} .led-mid{--led:var(--amber)} .led-hot{--led:var(--moss)}
.card h3 .aside,.panel h3 .aside{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);font-weight:400;letter-spacing:.04em;text-transform:uppercase}
.card h3 .grow,.panel h3 .grow{flex:1}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--f-mono);font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:400}
.legend span{display:flex;align-items:center;gap:6px}
.legend span::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:18px}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px;align-items:start}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}
.tilt{transform-style:preserve-3d;transition:transform .35s cubic-bezier(.2,.8,.2,1)}

/* readouts */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--chassis);border-radius:var(--r-sm);box-shadow:inset 0 2px 8px var(--sh),0 0 0 1px var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat .l{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:2.3rem;line-height:1;letter-spacing:-.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v small{font-family:var(--f-body);font-stretch:100%;font-size:.85rem;color:var(--muted);font-weight:500;letter-spacing:0}
.stat .s{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.neg{color:var(--neg)}.pos{color:var(--pos)}
.meter{height:6px;border-radius:99px;background:var(--chassis);box-shadow:inset 0 1px 3px var(--sh);overflow:hidden;margin-top:4px}
.meter b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,color-mix(in oklab,var(--moss) 70%,var(--amber)),var(--moss));box-shadow:0 0 10px var(--glow);transition:width .7s cubic-bezier(.2,.8,.2,1)}

/* habit rows as keys */
.h-moss{--hc:var(--moss)} .h-amber{--hc:var(--amber)} .h-lingon{--hc:var(--lingon)} .h-sky{--hc:var(--sky)} .h-heather{--hc:var(--heather)} .h-sand{--hc:var(--sand)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--hc);box-shadow:0 0 8px color-mix(in oklab,var(--hc) 60%,transparent);flex:none}
.hn{display:flex;align-items:center;gap:9px;font-size:.9rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hn small{color:var(--muted);font-family:var(--f-mono);font-size:.62rem;margin-left:auto;padding-left:6px;text-transform:uppercase}
.hname{color:var(--hc);font-weight:600}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:14px;background:var(--surface-2);box-shadow:inset 0 1px 0 var(--hi),0 0 0 1px var(--line);padding:13px 14px;transition:transform .18s cubic-bezier(.2,.8,.2,1),background .25s,box-shadow .25s;position:relative;overflow:hidden}
button.row:hover{background:var(--raise)}
button.row:active{transform:scale(.985)}
.row.on{background:color-mix(in oklab,var(--hc,var(--moss)) 12%,var(--surface-2));box-shadow:inset 0 1px 0 var(--hi),0 0 0 1px color-mix(in oklab,var(--hc,var(--moss)) 40%,var(--line))}
.box{width:26px;height:26px;border-radius:8px;background:var(--chassis);box-shadow:inset 0 2px 5px var(--sh),0 0 0 1px var(--line-2);display:grid;place-items:center;flex:none;color:var(--on-accent);transition:all .25s cubic-bezier(.2,.8,.2,1)}
.on>.box,.box.on{background:var(--hc,var(--moss));box-shadow:0 0 0 1px color-mix(in oklab,var(--hc,var(--moss)) 60%,#000),0 0 16px color-mix(in oklab,var(--hc,var(--moss)) 60%,transparent);color:#111}
.box svg{width:15px;height:15px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:.98rem;overflow-wrap:anywhere}
.row .t small{color:var(--muted);font-size:.78rem}
.row .meta{display:flex;gap:4px;flex:none}
.row .meta i{width:7px;height:16px;border-radius:3px;background:var(--chassis);box-shadow:inset 0 1px 2px var(--sh)}
.row .meta i.f{background:var(--hc);box-shadow:0 0 8px color-mix(in oklab,var(--hc) 55%,transparent)}
.row.restday{opacity:.55}
.stepper{display:flex;align-items:center;gap:8px;flex:none}
.stepper button{width:32px;height:32px;border-radius:50%;border:0;background:linear-gradient(160deg,var(--raise),var(--surface));box-shadow:inset 0 1px 0 var(--hi),0 3px 8px var(--sh),0 0 0 1px var(--line-2);font-size:1.05rem;line-height:1;padding:0}
.stepper button:active{transform:translateY(1px)}
.stepper output{min-width:66px;text-align:center;font-family:var(--f-mono);font-size:.8rem}
.cbar{height:5px;border-radius:9px;background:var(--chassis);margin-top:7px;overflow:hidden;max-width:240px}
.cbar b{display:block;height:100%;background:var(--hc);box-shadow:0 0 8px var(--hc)}
.dayhead{display:flex;align-items:center;gap:18px;margin-bottom:16px}
.dayhead .stats-s{display:flex;flex-direction:column;gap:2px;color:var(--muted);font-size:.86rem}
.dayhead strong{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:1.9rem;letter-spacing:-.04em;color:var(--ink);line-height:1}

/* tasks */
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.task{display:flex;align-items:flex-start;gap:12px;padding:9px 6px;border-radius:10px;transition:background .2s}
.task:hover{background:var(--surface-2)}
.tk{width:22px;height:22px;border:0;border-radius:7px;background:var(--chassis);box-shadow:inset 0 2px 4px var(--sh),0 0 0 1px var(--line-2);flex:none;padding:0;display:grid;place-items:center;margin-top:0;color:#111;transition:all .2s}
.tk.on{background:var(--dc,var(--moss));box-shadow:0 0 12px color-mix(in oklab,var(--dc,var(--moss)) 55%,transparent)}
.tk svg{width:13px;height:13px}
.task span{flex:1;min-width:0;font-size:.93rem;overflow-wrap:anywhere;line-height:1.45}
.task .rec{color:var(--faint);font-size:.72rem;margin-left:6px}
.task.done span{color:var(--faint);text-decoration:line-through}
.addf input,.addf2 input{width:100%;border:0;border-radius:12px;background:var(--chassis);box-shadow:inset 0 2px 6px var(--sh),0 0 0 1px var(--line);padding:11px 14px;font-size:.92rem;margin-top:8px}
.addf input:focus,.addf2 input:focus{outline:none;box-shadow:inset 0 2px 6px var(--sh),0 0 0 2px var(--moss)}
input::placeholder,textarea::placeholder{color:var(--faint)}
.dfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding-top:12px;flex-wrap:wrap}

/* LED rating bars */
.rates{display:flex;flex-direction:column;gap:10px}
.rate{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.84rem;color:var(--muted)}
.rate>div{display:flex;gap:4px;align-items:flex-end}
.rd{width:14px;border:0;border-radius:4px;background:var(--chassis);box-shadow:inset 0 1px 3px var(--sh),0 0 0 1px var(--line);padding:0;transition:all .2s}
.rd:nth-child(1){height:12px}.rd:nth-child(2){height:16px}.rd:nth-child(3){height:20px}.rd:nth-child(4){height:24px}.rd:nth-child(5){height:28px}
.rd.on{background:var(--rc);box-shadow:0 0 10px color-mix(in oklab,var(--rc) 60%,transparent)}
.r-energy{--rc:var(--amber)} .r-focus{--rc:var(--sky)} .r-motiv{--rc:var(--moss)} .r-mood{--rc:var(--lingon)}

/* brief & today modules */
.brief{background:radial-gradient(120% 140% at 100% 0%,color-mix(in oklab,var(--moss) 16%,transparent),transparent 55%),linear-gradient(175deg,var(--surface),var(--surface));display:flex;flex-direction:column;gap:16px;overflow:hidden}
.brief h3{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:clamp(1.6rem,3.2vw,2.4rem);line-height:1;letter-spacing:-.035em;margin:0}
.brief .focus{font-size:1.02rem;color:var(--ink);margin:0;opacity:.85}
.prio{list-style:none;margin:0;padding:0;counter-reset:p;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.prio li{counter-increment:p;display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;background:var(--chassis);box-shadow:inset 0 2px 6px var(--sh),0 0 0 1px var(--line)}
.prio li::before{content:counter(p,decimal-leading-zero);font-family:var(--f-mono);font-size:.7rem;color:var(--moss)}
.prio b{font-weight:600;display:block;font-size:.98rem}
.prio small{color:var(--muted);font-size:.8rem;flex:1}
.prio .btn{align-self:flex-start}
.brief .nudge{font-size:.88rem;color:var(--muted);margin:0;display:flex;gap:10px;align-items:baseline}
.brief .nudge::before{content:"!";font-family:var(--f-mono);color:var(--on-accent);background:var(--moss);border-radius:4px;padding:0 6px;font-size:.7rem}
.brief-empty{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brief-empty p{margin:8px 0 0;color:var(--muted);max-width:56ch;font-size:.92rem}
.signal{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--chassis);box-shadow:inset 0 2px 6px var(--sh),0 0 0 1px var(--line)}
.signal+.signal{margin-top:8px}
.signal .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;font-family:var(--f-mono);font-weight:700;font-size:.8rem;background:color-mix(in oklab,var(--sc,var(--moss)) 18%,transparent);color:var(--sc,var(--moss));box-shadow:0 0 0 1px color-mix(in oklab,var(--sc,var(--moss)) 40%,transparent)}
.signal .tx{flex:1;min-width:0;font-size:.9rem}
.signal .tx b{font-weight:600}
.signal .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.lesson h4{font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:1.35rem;line-height:1.15;margin:4px 0 10px}
.lesson .prose{margin-bottom:14px}
.lesson .task-l{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--chassis);box-shadow:inset 0 2px 6px var(--sh);margin-bottom:12px}
.lesson .task-l span{flex:1}
.q{display:flex;flex-direction:column;gap:8px}
.q span{font-weight:600;font-size:.98rem;line-height:1.35}
.qs{display:flex;flex-direction:column;gap:16px}
textarea{width:100%;resize:vertical;border:0;border-radius:12px;background:var(--chassis);box-shadow:inset 0 2px 6px var(--sh),0 0 0 1px var(--line);padding:11px 14px;min-height:52px;line-height:1.5}
textarea:focus{outline:none;box-shadow:inset 0 2px 6px var(--sh),0 0 0 2px var(--moss)}
.jlist{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:.86rem}
.jlist li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px}
.jlist time{color:var(--faint);font-family:var(--f-mono);font-size:.66rem;text-transform:uppercase;padding-top:2px}
.pq{display:flex;gap:14px;align-items:center;padding:12px;border-radius:12px;background:var(--surface-2);box-shadow:0 0 0 1px var(--line)}
.pq+.pq{margin-top:8px}
.pq>div{flex:1;min-width:0}
.pq b{display:block;font-weight:600}
.pq small{display:block;color:var(--muted);font-size:.8rem}
.ev{display:flex;gap:14px;font-size:.88rem;padding:9px 0;border-bottom:1px dashed var(--line-2)}
.ev time{color:var(--moss);min-width:100px;font-family:var(--f-mono);font-size:.78rem}
.ev span{overflow-wrap:anywhere;min-width:0}
.slot{font-size:.84rem;color:var(--muted);margin-top:10px}
.slot b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.timer{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.timer .clock2{font-family:var(--f-mono);font-size:3.4rem;font-weight:500;line-height:1;letter-spacing:-.04em;padding:10px 16px;border-radius:14px;background:#0a0a0a;color:var(--moss);text-shadow:0 0 18px var(--glow);box-shadow:inset 0 3px 10px rgb(0 0 0 / .8),0 0 0 1px var(--line-2)}
:root[data-skin="bone"] .timer .clock2{background:#1a1916}
.timer .ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select.inline,.timer select,.timer-sub select{border:0;border-radius:10px;background:var(--chassis);box-shadow:inset 0 1px 3px var(--sh),0 0 0 1px var(--line-2);padding:8px 10px;font-size:.84rem;max-width:100%}
.timer-sub{font-size:.8rem;color:var(--muted);margin-top:14px;display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center}
.quote-card{font-size:1.05rem;line-height:1.55}
.quote-card small{display:block;color:var(--muted);margin-top:10px;font-family:var(--f-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.04em}

/* habit grid */
.grid-card{padding:0;overflow:hidden}
.grid-card .scroll{padding:12px 0 14px}
table.g{border-collapse:separate;border-spacing:4px;font-size:.78rem}
table.g th,table.g td{padding:0;text-align:center}
table.g .name{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:0 12px 0 20px;min-width:210px;max-width:240px}
table.g thead .wk th{font-family:var(--f-mono);font-size:.6rem;color:var(--muted);font-weight:400;text-transform:uppercase;padding-bottom:4px}
table.g thead .dy th{font-family:var(--f-mono);font-weight:400;color:var(--faint);line-height:1.2;padding:4px 0;font-size:.6rem}
table.g thead .dy th b{display:block;color:var(--ink);font-weight:500;font-size:.78rem}
table.g thead .dy th.today b{color:var(--on-accent);background:var(--moss);border-radius:6px}
.c{width:28px;height:28px;border-radius:8px;border:0;background:var(--chassis);box-shadow:inset 0 2px 4px var(--sh),0 0 0 1px var(--line);display:grid;place-items:center;padding:0;transition:all .18s cubic-bezier(.2,.8,.2,1);font-family:var(--f-mono);font-size:.62rem;color:var(--muted)}
.c:hover{transform:scale(1.12)}
.c.on{background:var(--hc);box-shadow:0 0 12px color-mix(in oklab,var(--hc) 55%,transparent);color:#111}
.c.part{box-shadow:inset 0 0 0 2px var(--hc);color:var(--ink)}
.c.fut{opacity:.3}
.c.rest{background:repeating-linear-gradient(135deg,var(--line-2) 0 2px,var(--chassis) 2px 6px)}
.c.today{outline:2px solid var(--moss);outline-offset:2px}
.c svg{width:14px;height:14px}
.rowp{min-width:140px;padding:0 20px 0 10px!important;text-align:left!important}
.rowp .meter{margin:0 0 4px}
.rowp .meter b{background:var(--hc);box-shadow:0 0 8px var(--hc)}
.rowp small{color:var(--muted);font-family:var(--f-mono);font-size:.66rem;white-space:nowrap}
tr.sum th,tr.sum td{color:var(--faint);font-family:var(--f-mono);font-size:.62rem}
tr.sum.first th,tr.sum.first td{padding-top:10px!important}
tr.sum th.name{text-transform:uppercase}
.m{width:28px;height:28px;border-radius:8px;border:0;background:var(--chassis);box-shadow:inset 0 1px 3px var(--sh),0 0 0 1px dashed var(--line);padding:0;font-family:var(--f-mono);font-size:.7rem;color:var(--ink)}
.m.v{background:color-mix(in oklab, var(--mc) calc(var(--lv) * 17%), var(--chassis))}
.m.fut{opacity:.3}
.m-mood{--mc:var(--lingon)} .m-motiv{--mc:var(--amber)}
.m.r-on{box-shadow:0 0 0 2px var(--sky);color:var(--sky)}
tr.moodsep td,tr.moodsep th{padding-top:12px!important}
.add-row{padding:6px 20px 18px;display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center}

/* charts */
svg.chart{display:block;width:100%;min-width:520px;height:auto}
.chart .gl{stroke:var(--line-2);stroke-width:1;stroke-dasharray:2 5}
.chart .ax{fill:var(--faint);font-size:10px;font-family:var(--f-mono)}
.chart .ax.t{fill:var(--ink)}
.chart .ln{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{opacity:.14;stroke:none}
.s-moss{stroke:var(--moss);fill:var(--moss)} .s-amber{stroke:var(--amber);fill:var(--amber)} .s-lingon{stroke:var(--lingon);fill:var(--lingon)} .s-sky{stroke:var(--sky);fill:var(--sky)} .s-sand{stroke:var(--sand);fill:var(--sand)}
.chart .ln.s-moss,.chart .ln.s-amber,.chart .ln.s-lingon,.chart .ln.s-sky,.chart .ln.s-sand{fill:none}
.chart .pt{stroke:var(--surface);stroke-width:3}
.chart .bar-done{fill:var(--moss)} .chart .bar-left{fill:var(--line-2)}
.ringbox{position:relative;display:inline-grid;place-items:center;flex:none}
.ringbox span{position:absolute;font-family:var(--f-display);font-stretch:125%;font-weight:800;letter-spacing:-.04em}
.ring-bg{stroke:var(--chassis)} .ring-fg{stroke:var(--moss);filter:drop-shadow(0 0 6px var(--glow));transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}

/* week */
.wtop{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
.overall{display:flex;gap:22px;align-items:center}
.overall .bars{flex:1;min-width:0}
.overall .big{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.66rem;text-transform:uppercase;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
@media (max-width:1560px){.days{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}}
.day{padding:16px;display:flex;flex-direction:column;gap:12px}
.day.is-today{box-shadow:inset 0 1px 0 var(--hi),0 14px 34px -18px var(--sh),0 0 0 2px var(--moss)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dh>div{min-width:0}
.dh h4{font-family:var(--f-display);font-stretch:118%;font-weight:800;font-size:1.2rem;letter-spacing:-.02em;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.dh small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:.64rem;text-transform:uppercase}
.chip{font-family:var(--f-mono);font-size:.58rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--on-accent);background:var(--moss);border-radius:999px;padding:3px 8px}
.chip.alt{color:var(--muted);background:var(--chassis);box-shadow:0 0 0 1px var(--line-2)}
.dev{display:flex;flex-direction:column;gap:3px;font-size:.76rem;border-left:2px solid var(--sky);padding-left:10px;min-width:0}
.dev span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dev b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.prose{font-size:.96rem;line-height:1.7;max-width:70ch}
.prose p{margin:0 0 10px}
.prose strong{color:var(--ink)}
.dots{display:none;justify-content:center;gap:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.dots i.on{background:var(--moss);box-shadow:0 0 8px var(--glow)}

/* journey */
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.gcard{padding:18px;display:flex;flex-direction:column;gap:12px}
.gcard header{display:flex;align-items:flex-start;gap:14px}
.gcard header>div{flex:1;min-width:0}
.gcard h4{font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:1.15rem;line-height:1.2;overflow-wrap:anywhere}
.gcard small{color:var(--muted);font-size:.78rem}
.ms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.ms li{display:flex;gap:12px;align-items:center;font-size:.9rem;padding:6px 4px;border-radius:8px}
.ms li.done span{color:var(--faint);text-decoration:line-through}
.ms span{overflow-wrap:anywhere;min-width:0;flex:1}
.cgrid,.prog-days{display:grid;grid-template-columns:repeat(auto-fill,minmax(13px,1fr));gap:4px}
.cgrid i,.prog-days i{aspect-ratio:1;border-radius:3px;background:var(--chassis);box-shadow:inset 0 1px 2px var(--sh);max-width:100%}
.cgrid i.f{background:var(--hc);box-shadow:0 0 6px color-mix(in oklab,var(--hc) 55%,transparent)}
.prog-days i.f{background:var(--moss);box-shadow:0 0 6px var(--glow)}
.cgrid i.t,.prog-days i.t{outline:2px solid var(--ink);outline-offset:1px}
.cgrid i.fut{opacity:.4}
.peers{display:flex;flex-direction:column;gap:8px}
.peer{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.84rem}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bdg{padding:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;border-radius:14px;background:var(--chassis);box-shadow:inset 0 2px 6px var(--sh),0 0 0 1px var(--line)}
.bdg .md{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--faint);background:var(--surface);box-shadow:0 0 0 1px var(--line-2)}
.bdg.got .md{color:#111;background:linear-gradient(160deg,var(--amber),var(--moss));box-shadow:0 8px 20px -6px var(--glow)}
.bdg b{font-weight:700;font-size:.92rem}
.bdg small{color:var(--muted);font-size:.74rem;line-height:1.4}
.bdg:not(.got){opacity:.6}
.weeks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.weeks li{display:grid;grid-template-columns:74px minmax(0,1fr);gap:10px;padding:7px 10px;border-radius:8px;font-size:.88rem}
.weeks li span:first-child{color:var(--faint);font-family:var(--f-mono);font-size:.64rem;text-transform:uppercase;padding-top:3px}
.weeks li.cur{background:color-mix(in oklab,var(--moss) 12%,transparent)}
.weeks li.cur span:last-child{color:var(--moss);font-weight:600}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.lvl{padding:16px;border-radius:16px;background:var(--chassis);box-shadow:inset 0 2px 8px var(--sh),0 0 0 1px var(--line);display:flex;flex-direction:column;gap:10px}
.lvl .top2{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.lvl .n{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:2.2rem;line-height:1;letter-spacing:-.05em}
.lvl .n small{font-family:var(--f-mono);font-size:.6rem;color:var(--muted);letter-spacing:.06em;margin-right:4px;font-stretch:100%;font-weight:400}
.lvl .nm{font-weight:600;font-size:.92rem}
.lvl .xpl{font-family:var(--f-mono);font-size:.64rem;color:var(--muted)}

/* insights */
.ins{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.insight{padding:18px;font-size:.94rem;line-height:1.55;border-radius:16px;background:var(--surface);box-shadow:inset 0 1px 0 var(--hi),0 0 0 1px var(--line)}
.insight small{display:block;color:var(--moss);font-family:var(--f-mono);font-size:.64rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.insight b{color:var(--ink)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:480px;overflow-y:auto;padding:4px 2px}
.msg{max-width:84%;padding:12px 15px;font-size:.93rem;line-height:1.6;overflow-wrap:anywhere;border-radius:18px}
.msg p{margin:0 0 8px}.msg p:last-child{margin:0}
.msg.u{align-self:flex-end;background:var(--moss);color:var(--on-accent);border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--surface-2);box-shadow:0 0 0 1px var(--line);border-bottom-left-radius:6px}
.chatf{display:flex;gap:10px;margin-top:14px;align-items:center}
.chatf input{flex:1;min-width:0;border:0;border-radius:999px;background:var(--chassis);box-shadow:inset 0 2px 6px var(--sh),0 0 0 1px var(--line);padding:12px 16px}
.chatf input:focus{outline:none;box-shadow:inset 0 2px 6px var(--sh),0 0 0 2px var(--moss)}
.mentors{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:14px}
.mentor{padding:16px;border-radius:16px;background:var(--chassis);box-shadow:inset 0 2px 6px var(--sh),0 0 0 1px var(--line);display:flex;flex-direction:column;gap:8px}
.mentor .who{display:flex;align-items:center;gap:10px}
.mentor .who i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-family:var(--f-display);font-stretch:125%;font-weight:800;color:#111;background:var(--mc)}
.mentor .who b{font-weight:700}
.mentor .who small{display:block;color:var(--muted);font-size:.72rem}
.mentor p{margin:0;font-size:.9rem;line-height:1.55}
.story{display:flex;flex-direction:column;gap:20px}
.story .chapter{padding:20px;border-radius:16px;background:var(--chassis);box-shadow:inset 0 2px 8px var(--sh),0 0 0 1px var(--line)}
.story .chapter h4{font-family:var(--f-display);font-stretch:118%;font-weight:800;font-size:1.3rem;letter-spacing:-.02em;margin-bottom:8px}
.story .bignums{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.yr{border-collapse:separate;border-spacing:3px;font-size:.72rem}
.yr th{font-family:var(--f-mono);font-weight:400;color:var(--faint);text-align:left;padding-right:12px;white-space:nowrap;text-transform:uppercase;font-size:.6rem}
.yr td{padding:0}
.yc{width:13px;height:13px;border-radius:3px;background:var(--chassis);display:block}
.yc.l1{background:color-mix(in oklab, var(--moss) 28%, var(--chassis))}
.yc.l2{background:color-mix(in oklab, var(--moss) 52%, var(--chassis))}
.yc.l3{background:color-mix(in oklab, var(--moss) 76%, var(--chassis))}
.yc.l4{background:var(--moss);box-shadow:0 0 6px var(--glow)}
.yc.rs{background:repeating-linear-gradient(135deg, var(--line-2) 0 2px, var(--chassis) 2px 5px)}
.yc.na{background:transparent}
.yc.tdy{outline:2px solid var(--ink);outline-offset:1px}
.yr td.p{padding-left:12px;color:var(--muted);font-family:var(--f-mono);white-space:nowrap}
.scale{display:flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:.62rem;color:var(--muted);text-transform:uppercase}
.export{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rep{margin-bottom:16px}

/* projects */
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchip{border:0;border-radius:999px;padding:10px 16px;font-size:.84rem;font-weight:600;color:var(--muted);background:var(--surface);box-shadow:inset 0 1px 0 var(--hi),0 0 0 1px var(--line-2)}
.pchip:hover{color:var(--ink)}
.pchip.on{color:var(--on-accent);background:var(--moss);box-shadow:0 8px 20px -8px var(--glow)}
.pchip.add{background:transparent;box-shadow:0 0 0 1px dashed var(--line-2);outline:1px dashed var(--line-2);outline-offset:-1px}
.hero{display:flex;gap:26px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:28px;overflow:hidden;background:radial-gradient(90% 140% at 0% 0%,color-mix(in oklab,var(--moss) 14%,transparent),transparent 60%),linear-gradient(175deg,var(--surface),var(--surface))}
.hero-main{flex:1 1 340px;min-width:0}
.hero h2{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:clamp(2.1rem,5vw,3.6rem);line-height:.95;letter-spacing:-.045em;margin:8px 0 0;overflow-wrap:anywhere}
.goal-line{margin:14px 0 0;font-size:1rem;max-width:62ch}
.goal-line span{display:block;font-family:var(--f-mono);font-size:.64rem;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.hero-side{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hs{display:flex;flex-direction:column;gap:8px}
.hs b{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:1.4rem;letter-spacing:-.03em}
.alert{border-radius:14px;padding:14px 18px;font-size:.92rem;background:color-mix(in oklab,var(--neg) 14%,var(--surface));box-shadow:0 0 0 1px color-mix(in oklab,var(--neg) 50%,transparent)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.f{display:flex;flex-direction:column;gap:6px;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-width:0}
.f input,.f select,.fwide{border:0;border-radius:10px;background:var(--chassis);box-shadow:inset 0 2px 5px var(--sh),0 0 0 1px var(--line);padding:10px 12px;font-family:var(--f-body);font-size:.92rem;letter-spacing:0;text-transform:none;min-width:0;width:100%}
.f input:focus,.fwide:focus,.f select:focus{outline:none;box-shadow:inset 0 2px 5px var(--sh),0 0 0 2px var(--moss)}
.fwide{display:block;margin-bottom:14px}
.tform .check{margin-bottom:12px}
.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th{text-align:left;font-family:var(--f-mono);font-size:.6rem;text-transform:uppercase;color:var(--muted);font-weight:400;padding:8px 10px 8px 0;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl .r{text-align:right}
.tbl select{border:0;border-radius:8px;background:var(--chassis);box-shadow:0 0 0 1px var(--line-2);padding:5px 8px;font-size:.82rem}
.rules{margin:0 0 12px;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.rules li::marker{color:var(--moss);font-family:var(--f-mono)}
.calc{margin:6px 0 0;font-size:.94rem;line-height:1.7;color:var(--muted)}
.calc b{font-family:var(--f-display);font-stretch:125%;font-size:1.5rem;font-weight:800;color:var(--ink)}
.plist3{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:6px}
.plist3 li{display:flex;align-items:center;gap:12px;font-size:.92rem;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.plist3 li span{flex:1;min-width:0;overflow-wrap:anywhere}
.pst{border:0;border-radius:999px;padding:5px 10px;font-family:var(--f-mono);font-size:.6rem;text-transform:uppercase;font-weight:600;background:var(--chassis);min-width:86px;color:var(--muted);box-shadow:0 0 0 1px var(--line-2)}
.st-win{color:#111;background:var(--pos);box-shadow:0 0 12px color-mix(in oklab,var(--pos) 50%,transparent)}
.st-dead{color:var(--faint);text-decoration:line-through}
.st-test{color:#111;background:var(--amber)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{padding:12px;border-radius:14px;background:var(--chassis);box-shadow:inset 0 2px 6px var(--sh);display:flex;flex-direction:column;gap:8px;min-width:0}
.col h4{font-family:var(--f-mono);font-size:.62rem;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;font-weight:500}
.bcard{background:var(--surface);border-radius:10px;box-shadow:inset 0 1px 0 var(--hi),0 2px 8px var(--sh);padding:10px 12px;font-size:.88rem;display:flex;gap:8px;align-items:flex-start}
.bcard span{flex:1;min-width:0;overflow-wrap:anywhere}
.bcard>div{display:flex;gap:2px;align-items:center}
.adv-q{font-weight:600;color:var(--muted);margin-bottom:8px}
.minilist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.minilist li{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-radius:10px;background:var(--surface-2);font-size:.9rem}

/* life */
.lifenav{display:flex;gap:6px;flex-wrap:wrap}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.book{border:0;text-align:left;border-radius:6px 14px 14px 6px;padding:16px 14px 14px 20px;min-height:200px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;color:#fff;background:linear-gradient(160deg,color-mix(in oklab,var(--bc) 90%,#fff),var(--bc) 60%,color-mix(in oklab,var(--bc) 70%,#000));box-shadow:inset 6px 0 0 rgb(0 0 0 / .25),inset 7px 0 0 rgb(255 255 255 / .15),0 14px 26px -12px var(--sh);position:relative;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.book:hover{transform:translateY(-4px) rotate(-1deg)}
.book b{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:1.05rem;line-height:1.15;letter-spacing:-.02em;text-shadow:0 1px 2px rgb(0 0 0 / .3)}
.book small{font-size:.74rem;opacity:.85}
.book .bp{height:4px;border-radius:9px;background:rgb(0 0 0 / .25);overflow:hidden}
.book .bp i{display:block;height:100%;background:#fff}
.board-grid{columns:3 220px;column-gap:14px}
.vtile{break-inside:avoid;margin-bottom:14px;border-radius:16px;overflow:hidden;position:relative;background:var(--chassis);box-shadow:0 14px 30px -14px var(--sh),0 0 0 1px var(--line)}
.vtile img{display:block;width:100%;height:auto}
.vtile .cap2{position:absolute;inset:auto 0 0 0;padding:28px 14px 12px;background:linear-gradient(transparent,rgb(0 0 0 / .75));color:#fff;font-weight:600;font-size:.9rem}
.vtile.txt{padding:22px;font-family:var(--f-display);font-stretch:118%;font-weight:800;font-size:1.3rem;line-height:1.15;letter-spacing:-.02em;background:linear-gradient(160deg,var(--moss),color-mix(in oklab,var(--moss) 60%,var(--heather)));color:#fff}
.vtile .del{position:absolute;top:8px;right:8px;background:rgb(0 0 0 / .5);color:#fff;border-radius:50%;width:26px;height:26px;opacity:0}
.vtile:hover .del{opacity:1}
.show{position:fixed;inset:0;z-index:95;background:#000;display:grid;place-items:center;overflow:hidden}
.show .slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s ease;animation:kb 14s ease-in-out infinite alternate}
.show .slide.on{opacity:.6}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.16) translate(-2%,-1%)}}
.show .ov{position:relative;z-index:2;max-width:880px;padding:24px;text-align:center;color:#fff}
.show .ov h2{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:clamp(2rem,5.5vw,4.2rem);line-height:.98;letter-spacing:-.045em}
.show .ov p{font-size:1.1rem;opacity:.85;margin-top:18px}
.show .x{position:absolute;top:max(18px,env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px));z-index:3}
.envs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.env{position:relative;aspect-ratio:1.55;border-radius:12px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;background:linear-gradient(160deg,var(--raise),var(--surface-2));box-shadow:inset 0 1px 0 var(--hi),0 14px 26px -14px var(--sh),0 0 0 1px var(--line-2);overflow:hidden;border:0;text-align:left;color:var(--ink)}
.env::before{content:"";position:absolute;inset:0 0 auto 0;height:58%;background:linear-gradient(160deg,var(--surface-2),var(--chassis));clip-path:polygon(0 0,100% 0,50% 100%);box-shadow:inset 0 -1px 0 var(--line-2)}
.env .seal{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in oklab,var(--moss) 75%,#fff),var(--moss) 60%,color-mix(in oklab,var(--moss) 70%,#000));box-shadow:0 4px 12px var(--glow);display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-stretch:125%;font-weight:800}
.env b{position:relative;font-weight:700;font-size:.9rem}
.env small{position:relative;font-family:var(--f-mono);font-size:.62rem;text-transform:uppercase;color:var(--muted)}
.env.ready{box-shadow:inset 0 1px 0 var(--hi),0 0 0 2px var(--moss),0 0 30px -6px var(--glow);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 1px 0 var(--hi),0 0 0 2px var(--moss),0 0 46px -4px var(--glow)}}
.letter-open{padding:28px;border-radius:16px;background:var(--raise);box-shadow:0 0 0 1px var(--line-2);font-size:1.02rem;line-height:1.75;white-space:pre-wrap}
.dec{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:14px;background:var(--surface-2);box-shadow:0 0 0 1px var(--line)}
.dec+.dec{margin-top:8px}
.dec b{font-weight:600}
.dec small{color:var(--muted);font-size:.8rem}
.stars{display:inline-flex;gap:3px}
.stars i{width:10px;height:10px;border-radius:2px;background:var(--chassis);box-shadow:0 0 0 1px var(--line-2)}
.stars i.f{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.sets{display:flex;flex-direction:column;gap:6px}
.sets .it{display:grid;grid-template-columns:minmax(0,2fr) 70px 70px 70px auto;gap:6px;align-items:center}
.sets input{border:0;border-radius:8px;background:var(--chassis);box-shadow:inset 0 1px 3px var(--sh),0 0 0 1px var(--line);padding:8px 10px;min-width:0;font-size:.88rem}
.pb{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:10px;background:var(--surface-2);font-size:.9rem}
.pb b{font-family:var(--f-mono);font-weight:500;color:var(--moss)}
.pulse{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--surface-2);box-shadow:0 0 0 1px var(--line)}
.pulse+.pulse{margin-top:8px}
.pulse .meter{margin-top:6px}

/* vision & wheel */
.radar{display:block;width:100%;max-width:400px;margin:0 auto;height:auto}
.radar .rg{fill:none;stroke:var(--line-2)}
.radar .rl{fill:var(--muted);font-size:10px;font-family:var(--f-mono);text-transform:uppercase}
.radar .rp{fill:color-mix(in oklab,var(--moss) 22%,transparent);stroke:var(--moss);stroke-width:2;filter:drop-shadow(0 0 8px var(--glow))}
.radar .rp-prev{fill:none;stroke:var(--faint);stroke-dasharray:3 4;stroke-width:1.2}
.radar .rd2{fill:var(--moss)}
.vq{font-size:1.25rem;line-height:1.45;margin:0 0 18px;font-weight:500}
.idl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.idl li{font-size:.98rem;line-height:1.4;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.wdelta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;font-size:.84rem;margin-top:14px}
.wdelta .wd{display:flex;justify-content:space-between;gap:6px;padding:6px 10px;border-radius:8px;background:var(--surface-2)}
.wdelta small{font-size:.74rem}
.promo{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:24px;background:radial-gradient(100% 160% at 100% 0%,color-mix(in oklab,var(--moss) 18%,transparent),transparent 60%),linear-gradient(175deg,var(--surface),var(--surface))}
.promo h3{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:1.6rem;letter-spacing:-.035em;margin:6px 0 6px}
.promo p{margin:0;color:var(--muted);font-size:.92rem;max-width:58ch}

/* popover, sheet, overlay, toast */
.pop{position:absolute;z-index:70;background:var(--raise);border-radius:16px;padding:12px;box-shadow:0 22px 50px -12px rgb(0 0 0 / .7),0 0 0 1px var(--line-2);display:flex;flex-direction:column;gap:10px;font-size:.8rem;animation:popin .2s cubic-bezier(.2,.9,.2,1.2)}
@keyframes popin{from{transform:translateY(-6px) scale(.96)}}
.pop .row2{display:flex;gap:4px;align-items:center}
.pop .row2 button{width:38px;height:38px;border-radius:10px;border:0;background:var(--chassis);box-shadow:inset 0 1px 3px var(--sh),0 0 0 1px var(--line);display:grid;place-items:center;padding:0;font-family:var(--f-mono)}
.pop .row2 button.sel{background:var(--moss);color:var(--on-accent);box-shadow:0 0 12px var(--glow)}
.pop .row2 button svg{width:15px;height:15px}
.pop .row2 input{width:84px;border:0;border-radius:10px;background:var(--chassis);box-shadow:inset 0 1px 3px var(--sh),0 0 0 1px var(--line);padding:9px;text-align:center;font-family:var(--f-mono)}
.pop .lab{color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgb(0 0 0 / .55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px;animation:fade .25s ease}
@keyframes fade{from{background:rgb(0 0 0 / 0)}}
.sheet{background:linear-gradient(175deg,var(--raise),var(--surface));border-radius:24px;width:min(580px,100%);max-height:88vh;overflow:auto;padding:28px;display:flex;flex-direction:column;gap:18px;box-shadow:inset 0 1px 0 var(--hi),0 40px 80px -20px rgb(0 0 0 / .7),0 0 0 1px var(--line-2);animation:sheetin .35s cubic-bezier(.2,.9,.2,1)}
@keyframes sheetin{from{transform:translateY(24px) scale(.98)}}
.sheet h3{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:1.9rem;line-height:1;letter-spacing:-.04em}
.sheet .lead{margin:-6px 0 0;color:var(--muted);font-size:.9rem}
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.field .lbl{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{border:0;border-radius:12px;background:var(--chassis);box-shadow:inset 0 2px 5px var(--sh),0 0 0 1px var(--line);padding:11px 14px;min-width:0;font-size:.98rem}
.field input:focus,.field select:focus{outline:none;box-shadow:inset 0 2px 5px var(--sh),0 0 0 2px var(--moss)}
.field input+input{margin-top:2px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.check{display:flex;gap:12px;align-items:flex-start;font-size:.9rem;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--moss);width:17px;height:17px;flex:none}
.check small{display:block;color:var(--muted)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:32px;height:32px;border-radius:50%;border:3px solid var(--raise);background:var(--sw);box-shadow:0 0 0 1px var(--line-2);padding:0;transition:transform .2s}
.swatches button:hover{transform:scale(1.1)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.hl{display:flex;flex-direction:column;gap:8px}
.hl .it{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hl .it.boxed{border-radius:12px;background:var(--surface-2);box-shadow:0 0 0 1px var(--line);padding:8px 10px}
.hl input,.hl select{border:0;border-radius:10px;background:var(--chassis);box-shadow:inset 0 1px 3px var(--sh),0 0 0 1px var(--line);padding:9px 11px;min-width:0}
.hl select{font-size:.84rem;width:auto}
.hl input{flex:1;min-width:110px}
.hl input:focus{outline:none;box-shadow:inset 0 1px 3px var(--sh),0 0 0 2px var(--moss)}
.hl input.short{flex:0 0 72px;min-width:0}
.hl .sw{width:20px;height:20px;border-radius:50%;border:0;background:var(--hc);box-shadow:0 0 10px color-mix(in oklab,var(--hc) 60%,transparent);padding:0;flex:none}
.sheet .foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding-top:6px}
.confirm{font-size:.82rem;color:var(--neg);display:flex;gap:8px;align-items:center}
.note{font-size:.82rem;color:var(--muted);border-radius:12px;background:var(--chassis);padding:12px 14px;margin:0}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto}
.plist label{display:flex;gap:12px;align-items:center;font-size:.92rem;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.plist small{color:var(--moss);min-width:36px;font-family:var(--f-mono);font-size:.62rem;text-transform:uppercase}
.plist input{accent-color:var(--moss)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(28px + env(safe-area-inset-bottom, 0px));z-index:120;background:var(--ink);color:var(--bg);border-radius:999px;padding:12px 20px;font-size:.86rem;font-weight:600;max-width:calc(100% - 32px);text-align:center;box-shadow:0 18px 40px -12px rgb(0 0 0 / .6);animation:toastin .35s cubic-bezier(.2,.9,.2,1.3)}
@keyframes toastin{from{transform:translate(-50%,16px) scale(.9)}}
.more{position:fixed;inset:auto 0 0 0;z-index:65;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));background:var(--raise);border-radius:24px 24px 0 0;box-shadow:0 -20px 60px rgb(0 0 0 / .5),0 0 0 1px var(--line-2);display:grid;grid-template-columns:repeat(3,1fr);gap:10px;animation:sheetin .3s cubic-bezier(.2,.9,.2,1)}
.more button{border:0;border-radius:16px;padding:18px 10px;background:var(--surface-2);box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;font-size:.8rem;font-weight:600}
.more svg{width:22px;height:22px}

/* overlay */
.iv{position:fixed;inset:0;z-index:90;overflow-y:auto;background:var(--bg);background-image:radial-gradient(circle at 1px 1px, color-mix(in oklab,var(--ink) 7%,transparent) 1px, transparent 0);background-size:22px 22px;padding:max(22px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.iv-in{max-width:700px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:24px}
.iv-top{display:flex;align-items:center;gap:12px}
.iv-top svg{width:30px;height:30px}
.iv-count{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.iv-prog{height:6px;border-radius:99px;background:var(--chassis);box-shadow:inset 0 1px 3px var(--sh);overflow:hidden}
.iv-prog b{display:block;height:100%;border-radius:99px;background:var(--moss);box-shadow:0 0 12px var(--glow);transition:width .7s cubic-bezier(.2,.9,.2,1)}
.iv-body{display:flex;flex-direction:column;gap:20px;flex:1;padding-top:4vh}
.iv h2{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:clamp(2.4rem,7.5vw,4.4rem);line-height:.92;letter-spacing:-.05em}
.iv h2 em{font-style:normal;color:var(--moss)}
.iv .lead{color:var(--muted);font-size:1.04rem;margin:0;max-width:54ch}
.iv-foot{display:flex;justify-content:space-between;gap:10px;position:sticky;bottom:0;padding:18px 0 6px;background:linear-gradient(transparent,var(--bg) 30%)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.opts.sm{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.opt{text-align:left;border:0;border-radius:16px;background:linear-gradient(170deg,var(--surface),var(--surface-2));box-shadow:inset 0 1px 0 var(--hi),0 6px 16px -8px var(--sh),0 0 0 1px var(--line);padding:16px;display:flex;flex-direction:column;gap:4px;transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,background .2s}

</style><style>
.tsubs{margin:4px 0 2px}
.acct-chips{margin-top:-6px}
.lockb{display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:16px;background:color-mix(in oklab,var(--neg) 14%,var(--surface));box-shadow:0 0 0 1px color-mix(in oklab,var(--neg) 50%,transparent)}
.lockb .lk-ic{font-size:1.6rem}
.lockb b{display:block;font-weight:700}
.lockb small{color:var(--muted);font-size:.84rem}
.lockb small b{display:inline;color:var(--ink)}
.dsc-top{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.dsc-top>div{display:flex;flex-direction:column;align-items:center;min-width:80px}
.dsc-top .xp{font-size:2.6rem;line-height:1;color:var(--moss)}
.dsc-top small{font-family:var(--f-mono);font-size:.58rem;text-transform:uppercase;color:var(--muted);text-align:center}
.dbars{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;height:70px;align-items:end}
.dbars i{border-radius:4px;background:var(--line-2)}
.dbars i.ok{background:var(--pos)}.dbars i.mid{background:var(--amber)}.dbars i.bad{background:var(--neg)}.dbars i.na{background:var(--line)}
.sess-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.sess .label{display:block;margin-bottom:6px}
.grades{display:flex;gap:6px;margin:6px 0 12px}
.grade{width:44px;height:44px;border:0;border-radius:12px;font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:1.2rem;background:var(--chassis);box-shadow:inset 0 2px 5px var(--sh),0 0 0 1px var(--line);color:var(--muted)}
.grade[aria-pressed="true"]{color:#111;box-shadow:0 8px 18px -8px var(--sh)}
.grade.g-A[aria-pressed="true"]{background:var(--pos)}.grade.g-B[aria-pressed="true"]{background:var(--sand)}.grade.g-C[aria-pressed="true"]{background:var(--amber)}.grade.g-D[aria-pressed="true"]{background:var(--moss)}.grade.g-F[aria-pressed="true"]{background:var(--neg)}
.pcal{display:flex;flex-direction:column;gap:6px}
.pcal-h,.pcal-r{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(70px,.9fr);gap:6px}
.pcal-h span{font-family:var(--f-mono);font-size:.6rem;color:var(--faint);text-align:center;text-transform:uppercase}
.pc{position:relative;border:0;border-radius:10px;min-height:72px;padding:6px 8px;text-align:left;display:flex;flex-direction:column;gap:2px;background:var(--chassis);box-shadow:inset 0 1px 3px var(--sh),0 0 0 1px var(--line);color:var(--ink);transition:transform .15s}
.pc:hover{transform:scale(1.03)}
.pc.na{background:none;box-shadow:none}
.pc.up{background:color-mix(in oklab,var(--pos) calc(var(--a) * 100%),var(--chassis))}
.pc.dn{background:color-mix(in oklab,var(--neg) calc(var(--a) * 100%),var(--chassis))}
.pc.today{box-shadow:0 0 0 2px var(--ink)}
.pc.sel{box-shadow:0 0 0 2px var(--moss)}
.pc .pd{font-family:var(--f-mono);font-size:.62rem;color:var(--muted)}
.pc b{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:.95rem;letter-spacing:-.02em}
.pc small{font-family:var(--f-mono);font-size:.56rem;color:var(--muted)}
.pc .dd{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%}
.pc .dd.ok{background:var(--pos)}.pc .dd.mid{background:var(--amber)}.pc .dd.bad{background:var(--neg)}
.pc.wk{display:flex;align-items:center;justify-content:flex-end;font-family:var(--f-mono);font-size:.76rem;background:transparent;box-shadow:none;cursor:default}
.pc-day{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line-2)}
.pc-day h4{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:1.1rem;margin-bottom:8px}
.trow{cursor:pointer}
.trow:hover td{background:var(--surface-2)}
.mtag{display:inline-block;font-size:.66rem;padding:2px 7px;border-radius:99px;margin:1px 3px 1px 0;background:color-mix(in oklab,var(--neg) 16%,transparent);color:var(--neg);white-space:nowrap}
.hist{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:180px;align-items:end}
.hb{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-family:var(--f-mono);font-size:.62rem;color:var(--muted)}
.hb i{width:100%;border-radius:8px 8px 3px 3px;min-height:3px}
.hb i.neg{background:var(--neg)}.hb i.z{background:var(--line-2)}.hb i.pos{background:var(--pos)}
.mist{display:flex;flex-direction:column;gap:6px}
.mi{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.mi .mtag{font-size:.78rem;padding:4px 10px;justify-self:start}
.mi b{font-family:var(--f-mono);font-weight:500}
.pbk{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.pbs{border:0;text-align:left;padding:0;border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:inset 0 1px 0 var(--hi),0 14px 30px -18px var(--sh),0 0 0 1px var(--line);color:var(--ink);display:flex;flex-direction:column;transition:transform .2s}
.pbs:hover{transform:translateY(-3px)}
.pbs img{width:100%;height:140px;object-fit:cover;background:var(--chassis)}
.pbs-in{padding:16px;display:flex;flex-direction:column;gap:6px}
.pbs-in b{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:1.1rem}
.pbs-in small{color:var(--muted);font-size:.78rem}
.pbs-in ul{margin:4px 0 0;padding-left:18px;font-size:.84rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.pbs-st{margin-top:6px;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.accts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.acct-card.is-bad{box-shadow:inset 0 1px 0 var(--hi),0 0 0 1px color-mix(in oklab,var(--neg) 60%,transparent)}
.acct-card.is-ok{box-shadow:inset 0 1px 0 var(--hi),0 0 0 2px var(--pos),0 0 36px -12px var(--pos)}
.fspan{grid-column:1/-1}
.mchips{margin:2px 0 12px}
.mck{position:relative;cursor:pointer}
.mck input{position:absolute;opacity:0;pointer-events:none}
.mck span{display:inline-block;border-radius:999px;padding:6px 11px;font-size:.76rem;color:var(--muted);background:var(--surface-2);box-shadow:0 0 0 1px var(--line-2);transition:all .2s}
.mck input:checked+span{color:#fff;background:var(--neg);box-shadow:0 6px 14px -6px var(--neg)}
.impf{display:inline-flex;gap:6px;align-items:center}
.frow3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.shots{display:flex;gap:8px;flex-wrap:wrap}
.shot{position:relative;width:110px;height:76px;border-radius:10px;overflow:hidden;background:var(--chassis);box-shadow:0 0 0 1px var(--line-2)}
.shot img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.shot .del{position:absolute;top:4px;right:4px;background:rgb(0 0 0 / .6);color:#fff;border-radius:50%;width:22px;height:22px}
.shot.add{display:grid;place-items:center;font-size:1.6rem;color:var(--muted);cursor:pointer;border:1.5px dashed var(--line-2);box-shadow:none}
.shot.add input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sess-now{margin:0 0 12px;font-size:.88rem;color:var(--muted)}
.sess-now b{color:var(--ink)}
.sbar-wrap{position:relative;padding-top:18px}
.sbar-hours{position:absolute;top:0;left:92px;right:0;height:14px}
.sbar-hours span{position:absolute;transform:translateX(-50%);font-size:.58rem;color:var(--faint)}
.srow{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;align-items:center;margin-bottom:6px}
.sl{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl.on{color:var(--ink);font-weight:600}
.strack{position:relative;height:16px;border-radius:6px;background:var(--chassis);box-shadow:inset 0 1px 3px var(--sh);overflow:hidden}
.strack i{position:absolute;top:2px;bottom:2px;border-radius:4px;background:color-mix(in oklab,var(--sc) 45%,transparent)}
.strack i.on{background:var(--sc);box-shadow:0 0 10px var(--sc)}
.strack .nowl{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);box-shadow:0 0 6px var(--ink)}
.srow.kz .strack i{background:repeating-linear-gradient(135deg,color-mix(in oklab,var(--sc) 55%,transparent) 0 3px,transparent 3px 6px)}
.wl-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.wl h3 .chips button{padding:6px 10px;font-size:.72rem}
.mk-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:18px;align-items:start}
.tvbox{border-radius:12px;overflow:hidden}
.tvbox.tape{min-height:46px;border-radius:999px;background:var(--chassis);box-shadow:inset 0 2px 6px var(--sh),0 0 0 1px var(--line)}
.tvbox.chart{height:520px}
.tvbox.quotes{height:420px}
.tvbox.news{height:560px}
.tvbox.cal{height:600px}
.tvbox .tradingview-widget-copyright{font-size:.7rem;color:var(--faint)}
@media (max-width:980px){.mk-grid{grid-template-columns:1fr}.tvbox.chart{height:420px}}

  ticks.forEach(v=>{s+=`<line class="gl" x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${P.l-10}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`});
  for(let i=0;i<n;i++){const l=xl(i);if(l)s+=`<text class="ax${l.t?' t':''}" x="${x(i)}" y="${h-7}" text-anchor="middle">${l.s}</text>`}
  series.forEach(se=>{const segs=[];let cur=[];se.vals.forEach((v,i)=>{if(v==null){if(cur.length)segs.push(cur);cur=[]}else cur.push([x(i),y(v)])});if(cur.length)segs.push(cur);
    segs.forEach(sg=>{const d=sg.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');if(se.area&&sg.length>1)s+=`<path class="ar s-${se.c}" d="${d} L${sg[sg.length-1][0].toFixed(1)} ${y(min)} L${sg[0][0].toFixed(1)} ${y(min)} Z"/>`;if(sg.length>1)s+=`<path class="ln s-${se.c}" d="${d}"/>`});
    let li=-1;se.vals.forEach((v,i)=>{if(v!=null)li=i});if(li>=0)s+=`<circle class="pt s-${se.c}" cx="${x(li)}" cy="${y(se.vals[li])}" r="3.5"/>`});
  return s+'</svg>'}

/* ---------- Habits ---------- */
function monthInfo(y,m){const n=new Date(y,m+1,0).getDate();const t=today();const ty=t.getFullYear(),tm=t.getMonth();const past=y<ty||(y===ty&&m<tm);const cur=y===ty&&m===tm;return {n,elapsed:past?n:cur?t.getDate():0,todayD:cur?t.getDate():-1}}
function monthIsFuture(y,m){const t=today();return y>t.getFullYear()||(y===t.getFullYear()&&m>t.getMonth())}
function monthStats(y,m){const {n,elapsed}=monthInfo(y,m);const md=MD(y,m);const H=S.cfg.habits;let restN=0;for(let d=1;d<=elapsed;d++)if(md.rest[d])restN++;const active=elapsed-restN;let done=0,goal=0,capped=0;
  const rows=H.map(h=>{const c=md.checks[h.id]||{};let cnt=0;for(let d=1;d<=elapsed;d++)if(okv(h,c[d]||0))cnt++;const g=active>0?Math.max(1,Math.round(h.target*active/7)):0;done+=cnt;goal+=g;capped+=Math.min(cnt,g);return {h,c,cnt,g}});
  let perfect=0;for(let d=1;d<=elapsed;d++){if(H.length&&H.every(h=>okv(h,(md.checks[h.id]||{})[d]||0)))perfect++}
  let ms=0,mn=0,js=0;for(let d=1;d<=elapsed;d++){if(md.mood[d]){ms+=md.mood[d];mn++}if(md.journal[d])js++}
  return {n,elapsed,rows,done,goal,p:pct(capped,goal),restN,perfect,moodAvg:mn?ms/mn:0,journalN:js}}
function avg(vals,upto){let s=0,k=0;for(let d=1;d<=upto;d++)if(vals[d]){s+=vals[d];k++}return k?T('avg ','snitt ')+fmt1(s/k):'–'}

  st.rows.forEach(({h,c})=>{let run=0,l=0;for(let d=1;d<=n;d++){if(okv(h,c[d]||0)){run++;l=Math.max(l,run)}else if(!md.rest[d])run=0}if(l>best.len)best={len:l,name:h.name}});

  let body=st.rows.map(({h,c,cnt,g})=>{let tr=`<tr class="h-${h.hue}"><th class="name" scope="row"><div class="hn" title="${esc(h.name)}"><span class="dot"></span><span style="overflow:hidden;text-overflow:ellipsis">${esc(h.name)}</span><small>${h.type==='count'?h.goal+' '+esc(h.unit):h.target<7?T(`${h.target}/wk`,`${h.target} d/v`):T('daily','dagligen')}</small></div></th>`;

    for(let d=1;d<=n;d++){const v=vals[d];const fut=future||d>elapsed;tr+=`<td><button class="m m-${kind}${v?' v':''}${fut?' fut':''}" style="--lv:${v||0}" data-act="rate" data-k="${kind}" data-date="${ds(d)}" aria-label="${label} ${d} ${MONTHS[S.m]}: ${v||'–'}">${v||''}</button></td>`}

/* ---------- Week ---------- */

  const isCur=sameDay(mondayOf(t),mon);const maxN=Math.max(4,...per.map(p=>p.n));const W=420,Hh=160,P={l:6,r:6,t:22,b:24};const bw=(W-P.l-P.r)/7;

  const ser=k=>{const a=[];for(let i=0;i<7;i++)a.push(getRate(k,addDays(mon,i))||null);return a};const hasRates=['energy','focus','motiv'].some(k=>ser(k).some(v=>v!=null));const xl=i=>({s:WD[i].slice(0,3),t:sameDay(addDays(mon,i),t)});
  let days='',dots='';
  for(let i=0;i<7;i++){const date=addDays(mon,i);const l=w.tasks[i]||[];const p=per[i];const isT=sameDay(date,t);const lab=', '+WD[i];const evs=calOn()?eventsOn(date):[];
    days+=`<div class="day${isT?' is-today':''}"><div class="dh"><div><h4>${WD[i]}${isT?`<span class="chip">${T('Today','Idag')}</span>`:''}${isRest(date)?`<span class="chip alt">${T('Rest','Vila')}</span>`:''}</h4><small>${longDate(date)}</small></div>${ring(p.n?p.d/p.n:0,46,2,p.n?pct(p.d,p.n)+'%':'–')}</div>
      ${evs.length?`<div class="dev">${evs.slice(0,4).map(x=>`<span><b>${x.allDay?T('All day','Heldag'):hm(x.start)}</b> ${esc(x.title)}</span>`).join('')}${evs.length>4?`<span>+${evs.length-4}</span>`:''}</div>`:''}

      <form class="addf" data-date="${dkey(date)}"><input id="add-${i}" name="t" placeholder="${T('Add a task','Lägg till en uppgift')}" autocomplete="off" maxlength="120" aria-label="${T('New task for','Ny uppgift för')} ${WD[i]}"></form>
      <div class="rates">${rateRow('energy',T('Energy','Energi'),date,lab)}${rateRow('focus',T('Focus','Fokus'),date,lab)}${rateRow('motiv',T('Motivation','Motivation'),date,lab)}</div>
      <div class="dfoot num"><span>${p.d}/${p.n}${w.focusMin[i]?` · ${w.focusMin[i]} min ${T('focus','fokus')}`:''}</span>${p.n-p.d?`<button class="btn small ghost" data-act="move" data-date="${dkey(date)}" title="${T('Move open tasks to the next day','Flytta kvarvarande till nästa dag')}">${T('Move','Flytta')} →</button>`:''}</div></div>`;
    dots+=`<i class="${isT?'on':''}"></i>`}

function tradeStats(d,f){const Tr=d.trades.filter(f||(()=>true));const n=Tr.length;const wins=Tr.filter(t=>t.pnl>0),loss=Tr.filter(t=>t.pnl<0);const net=Tr.reduce((s,t)=>s+t.pnl,0);const gw=wins.reduce((s,t)=>s+t.pnl,0),gl=-loss.reduce((s,t)=>s+t.pnl,0);
  return {n,net,win:n?wins.length/n:0,pf:gl?gw/gl:(gw?Infinity:0),avgW:wins.length?gw/wins.length:0,avgL:loss.length?gl/loss.length:0,rules:n?Tr.filter(t=>t.rules).length/n:0,avg:n?net/n:0}}
function ecomStats(d,days=30){const from=dkey(addDays(today(),-days+1));const K=d.kpis.filter(k=>k.d>=from);const rev=K.reduce((s,k)=>s+(+k.rev||0),0),ad=K.reduce((s,k)=>s+(+k.ad||0),0),ord=K.reduce((s,k)=>s+(+k.orders||0),0),cogs=K.reduce((s,k)=>s+(+k.cogs||0),0);return {rev,ad,ord,cogs,roas:ad?rev/ad:0,aov:ord?rev/ord:0,profit:rev-ad-cogs,n:K.length}}

function calcRisk(){const g=id=>parseFloat((document.getElementById(id)||{}).value);const out=document.getElementById('rc-out');if(!out)return;const cp=g('rc-cap'),r=g('rc-risk'),en=g('rc-entry'),st=g('rc-stop');
  if(!(cp>0&&r>0)){out.textContent=T('Enter your account size and risk.','Fyll i konto och risk.');return}const rk=cp*r/100;
  if(!(en>0&&st>0&&en!==st)){out.innerHTML=T(`You risk <b>${money(rk)}</b> per trade. Add entry and stop for position size.`,`Du riskerar <b>${money(rk)}</b> per trade. Fyll i ingång och stopp för positionsstorlek.`);return}
  const size=Math.floor(rk/Math.abs(en-st));out.innerHTML=T(`Risk <b>${money(rk)}</b> · max <b class="num">${size.toLocaleString(LOC())}</b> units · value ${money(size*en)}`,`Risk <b>${money(rk)}</b> · högst <b class="num">${size.toLocaleString(LOC())}</b> st · värde ${money(size*en)}`)}

function analysisRows(nDays){const H=S.cfg.habits;const t=today();const rows=[];for(let i=1;i<=nDays;i++){const d=addDays(t,-i);if(isRest(d))continue;const done=H.map(h=>isDone(h.id,d));const mood=getRate('mood',d),motiv=getRate('motiv',d);if(done.some(Boolean)||mood)rows.push({d,done,mood,motiv})}return rows}
function computeInsights(){const H=S.cfg.habits;const rows=analysisRows(56);const out=[];if(rows.length<10||!H.length)return {few:true,n:rows.length};const hn=h=>`<span class="hname h-${h.hue}">${esc(h.name)}</span>`;
  const pairs=[];H.forEach((a,i)=>H.forEach((b,j)=>{if(i===j)return;const wA=rows.filter(r=>r.done[i]),nA=rows.filter(r=>!r.done[i]);if(wA.length<5||nA.length<5)return;const p1=wA.filter(r=>r.done[j]).length/wA.length,p0=nA.filter(r=>r.done[j]).length/nA.length;if(p1-p0>=.2)pairs.push({score:p1-p0,a,b,p1,p0,key:[a.id,b.id].sort().join()})}));
  const seen=new Set();pairs.sort((x,y)=>y.score-x.score).forEach(p=>{if(seen.has(p.key)||seen.size>=2)return;seen.add(p.key);out.push({score:p.score,label:T('Habits that travel together','Vanor som hänger ihop'),html:T(`On days you complete ${hn(p.a)}, you complete ${hn(p.b)} <b>${Math.round(p.p1*100)}%</b> of the time, against ${Math.round(p.p0*100)}% otherwise.`,`De dagar du klarar ${hn(p.a)} klarar du ${hn(p.b)} i <b>${Math.round(p.p1*100)}%</b> av fallen, mot ${Math.round(p.p0*100)}% andra dagar.`)})});
  [['mood',T('mood','humör')],['motiv',T('motivation','motivation')]].forEach(([k,lab])=>{const rr=rows.filter(r=>r[k]);const c=[];H.forEach((h,i)=>{const a=rr.filter(r=>r.done[i]),b=rr.filter(r=>!r.done[i]);if(a.length<4||b.length<4)return;const diff=a.reduce((s,r)=>s+r[k],0)/a.length-b.reduce((s,r)=>s+r[k],0)/b.length;if(Math.abs(diff)>=.4)c.push({h,diff})});
    c.sort((x,y)=>Math.abs(y.diff)-Math.abs(x.diff)).slice(0,k==='mood'?2:1).forEach(x=>out.push({score:Math.abs(x.diff)/2+.05,label:cap(lab),html:T(`Your ${lab} is on average <b>${fmt1(Math.abs(x.diff))} ${x.diff>0?'higher':'lower'}</b> on days you complete ${hn(x.h)}.`,`Ditt ${lab==='humör'?'humör':'motivationsläge'} är i snitt <b>${fmt1(Math.abs(x.diff))} ${x.diff>0?'högre':'lägre'}</b> de dagar du klarar ${hn(x.h)}.`)}))});
  const wdS=Array(7).fill(0),wdN=Array(7).fill(0);rows.forEach(r=>{const i=wdIdx(r.d);wdS[i]+=r.done.filter(Boolean).length;wdN[i]+=H.length});const valid=wdS.map((s,i)=>[wdN[i]>=H.length*3?s/wdN[i]:null,i]).filter(x=>x[0]!=null);
  if(valid.length>=5){valid.sort((a,b)=>b[0]-a[0]);const [bR,bI]=valid[0],[wR,wI]=valid[valid.length-1];if(bR-wR>=.12)out.push({score:(bR-wR)*.9,label:T('Rhythm of the week','Veckans rytm'),html:T(`<b>${WD_PL[bI]}</b> are your strongest days (${Math.round(bR*100)}%) and <b>${WD_PL[wI]}</b> your weakest (${Math.round(wR*100)}%).`,`<b>${cap(WD_PL[bI])}</b> är dina starkaste dagar (${Math.round(bR*100)}%) och <b>${WD_PL[wI]}</b> dina svagaste (${Math.round(wR*100)}%).`)})}
  const rate=(a,b)=>{const rr=rows.filter(r=>{const x=daysBetween(r.d,today());return x>=a&&x<=b});const n=rr.length*H.length;return n?rr.reduce((s,r)=>s+r.done.filter(Boolean).length,0)/n:null};const r1=rate(1,14),r0=rate(15,28);
  if(r1!=null&&r0!=null&&Math.abs(r1-r0)>=.08)out.push({score:Math.abs(r1-r0),label:T('Trend','Trend'),html:r1>r0?T(`You complete <b>${Math.round(r1*100)}%</b> of your habits over the last two weeks, up from ${Math.round(r0*100)}%.`,`Du klarar <b>${Math.round(r1*100)}%</b> av dina vanor de senaste två veckorna, upp från ${Math.round(r0*100)}%.`):T(`The last two weeks you complete <b>${Math.round(r1*100)}%</b> of your habits, down from ${Math.round(r0*100)}%. Consider lowering one target.`,`De senaste två veckorna klarar du <b>${Math.round(r1*100)}%</b> av vanorna, ner från ${Math.round(r0*100)}%. Fundera på att sänka ett mål.`)});
  const hr=H.map((h,i)=>({h,r:rows.filter(r=>r.done[i]).length/rows.length})).sort((a,b)=>a.r-b.r);if(hr.length>1&&hr[0].r<.45)out.push({score:.2,label:T('Room to grow','Att jobba på'),html:T(`${hn(hr[0].h)} is the habit you complete least often (${Math.round(hr[0].r*100)}% of days). A lower weekly target may make it stick.`,`${hn(hr[0].h)} är vanan du klarar minst ofta (${Math.round(hr[0].r*100)}% av dagarna). Ett lägre veckomål kan få den att fastna.`)});
  return {list:out.sort((a,b)=>b.score-a.score).slice(0,6),n:rows.length}}
