const LNG=()=>LANG==='sv'?'Swedish':'English';
const aiError=e=>e&&e.code==='not_granted'?T('Allow Vantor to ask Claude to use this.','Godkänn att Vantor får fråga Claude för att använda detta.'):e&&e.code==='rate_limited'?T('Too many requests right now. Try again in a moment.','För många förfrågningar just nu. Prova igen om en stund.'):T('Claude could not answer right now.','Claude kunde inte svara just nu.');
function projSummary(p){const d=PD(p.id);const mon=mondayOf(today());const ST=STAGES_();
  const L=[`Project: ${p.name} (${PT(p.type).label}), stage: ${ST[p.stage]||'–'}, 12-month goal: ${p.goal||'–'}, biggest challenge: ${p.obstacle||'–'}, time this week ${fmtH(projHoursWeek(p,mon))} of ${fmtH(p.hoursGoal||0)}.`];
  const cl=p.checklist||[];L.push(`Next steps (${cl.filter(c=>c.done).length}/${cl.length} done): ${cl.filter(c=>!c.done).slice(0,6).map(c=>c.text).join('; ')||'–'}`);
  if(p.type==='trading'){const s=tradeStats(d);L.push(`Trading: ${s.n} trades, net ${money(s.net)}, win rate ${Math.round(s.win*100)}%, profit factor ${pfTxt(s.pf)}, avg win ${money(s.avgW)}, avg loss ${money(s.avgL)}, rules followed ${Math.round(s.rules*100)}%. Market: ${(p.extra||{}).market||'–'}. Daily max loss: ${(p.extra||{}).maxLoss?money(p.extra.maxLoss):'–'}. Rules: ${(p.rules||[]).join('; ')||'–'}.`);
    const last=d.trades.slice().sort((a,b)=>a.d<b.d?1:-1).slice(0,20);if(last.length)L.push('Recent trades (date, instrument, side, result, setup, emotion, rules):\n'+last.map(x=>`- ${x.d} ${x.sym||'–'} ${x.dir} ${money(x.pnl)} ${x.setup||'–'} ${x.emo||'–'} ${x.rules?'followed':'broke'}${x.note?' ('+x.note+')':''}`).join('\n'))}
  if(p.type==='ecom'){const s=ecomStats(d);const PS=PSTAT_();L.push(`E-commerce last 30 days: revenue ${money(s.rev)}, ad spend ${money(s.ad)}, ROAS ${s.ad?fmt1(s.roas):'–'}, orders ${s.ord}, AOV ${money(s.aov)}, profit ${money(s.profit)}. Niche: ${(p.extra||{}).niche||'–'}. Product tests: ${d.items.filter(i=>i.kind==='product').map(i=>`${i.text} (${PS[i.status]})`).join('; ')||'–'}.`)}
  if(p.type==='content'){const c=[0,0,0,0];d.items.filter(i=>i.kind==='content').forEach(i=>c[i.stage]++);L.push(`Content pipeline: ${CSTAGES_().map((s,i)=>`${s} ${c[i]}`).join(', ')}.`)}
  if(p.type==='freelance'){const fs=freeStats(d);L.push(`Freelance: pipeline ${money(fs.pipe)}, won ${money(fs.won)}, win rate ${Math.round(fs.rate*100)}%.`)}
  if(d.metric.length){const M=d.metric.slice().sort((a,b)=>a.d<b.d?-1:1);L.push(`${metricName(p)}: latest ${M[M.length-1].v} (${M[M.length-1].d}), first ${M[0].v} (${M[0].d}).`)}
  return L.join('\n')}
function personalSummary(short){const c=S.cfg;const L=[];
  if(c.areas.length)L.push('Wants to improve: '+c.areas.map(AREA_N).join(', '));if(c.vision)L.push('Vision for one year from now: '+c.vision);
  if(c.identity.length&&!short)L.push('Who they want to become: '+c.identity.join(' '));

let tickT=null;let audioCtx=null;

function tick(){const Tm=S.timer;if(!Tm.running)return;Tm.left=Math.max(0,Math.round((Tm.endAt-Date.now())/1000));const el=document.getElementById('clock');if(el)el.textContent=pad(Math.floor(Tm.left/60))+':'+pad(Tm.left%60);document.title=Tm.left?`${pad(Math.floor(Tm.left/60))}:${pad(Tm.left%60)} · Vantor`:'Vantor';if(!Tm.left)finishTimer()}

  S.cfg.stats.pomos=(S.cfg.stats.pomos||0)+1;S.cfg.stats.focusMin=(S.cfg.stats.focusMin||0)+Tm.dur;saveCfg();const task=Tm.task&&tasksOf(t).find(x=>x.id===Tm.task);Tm.left=Tm.dur*60;document.title='Vantor';
  toast(T(`${Tm.dur} minutes of focus${task?' on '+task.text:''}. Well done.`,`${Tm.dur} minuter fokus${task?' på '+task.text:''}. Bra jobbat.`));render(false);checkBadges()}

function onSheetInput(e){const t=e.target;const c=sheetCtx;if(xSheetInput(e,t,c))return;
  if(t.dataset.pf){if(e.type==='change'){S.cfg.profile=S.cfg.profile||{};S.cfg.profile[t.dataset.pf]=t.value.trim();saveCfg();renderChrome()}return}
  if(t.dataset.cur){S.cfg.currency=t.value;saveCfg();return}
  if(t.dataset.flag){if(e.type==='change'){S.cfg.flags[t.dataset.flag]=t.checked;saveCfg();if(t.checked)fetchEvents(today(),true)}return}
  if(t.dataset.hname){if(e.type==='change'){const h=habitById(t.dataset.hname);const v=t.value.trim();if(h&&v){h.name=v;saveCfg()}}return}
  if(t.dataset.tid){const h=habitById(t.dataset.tid);if(h){h.target=+t.value;saveCfg()}return}
  if(t.dataset.type){if(e.type!=='change')return;const h=habitById(t.dataset.type);if(h){h.type=t.value;if(h.type==='count'&&(!h.goal||h.goal<2)){h.goal=8;h.unit=h.unit||'#'}saveCfg();renderSheet()}return}
  if(t.dataset.goal){const h=habitById(t.dataset.goal);if(h){h.goal=Math.max(1,Math.round(+t.value||1));saveCfg()}return}
  if(t.dataset.unit){const h=habitById(t.dataset.unit);if(h){h.unit=t.value.trim();saveCfg()}return}
  if(!c)return;
  if(t.dataset.g)c[t.dataset.g]=t.value;
  if(t.dataset.ms){const m=c.ms.find(x=>x.id===t.dataset.ms);if(m)m.text=t.value}
  if(t.dataset.c){if(t.dataset.c==='days')c.days=+t.value;else if(t.dataset.c==='shared')c.shared=t.checked;else c[t.dataset.c]=t.value}
  if(t.dataset.pg){c[t.dataset.pg]=t.dataset.pg==='days'?+t.value:t.value}
  if(t.dataset.r){if(t.dataset.r==='kind'){if(e.type==='change'&&c.kind!==t.value){c.kind=t.value;renderSheet()}}else if(t.dataset.r==='day')c.day=+t.value;else c.text=t.value}
  if(t.dataset.plan)c.text=t.value;
  if(t.dataset.pick!=null)c.result[+t.dataset.pick].pick=t.checked;
  if(t.dataset.pj){c[t.dataset.pj]=t.value;if(t.dataset.pj==='name')c.nameTouched=true}
  if(t.dataset.pjx)c.extra[t.dataset.pjx]=t.value;
  if(t.dataset.wh){c.scores[t.dataset.wh]=+t.value;const o=document.getElementById('who-'+t.dataset.wh);if(o)o.textContent=t.value}
  if(t.dataset.vs)c.vision=t.value;
  if(t.dataset.vi!==undefined)c.identity[+t.dataset.vi]=t.value;
  if(t.dataset.vq)c[t.dataset.vq][+t.dataset.i]=t.value;
}

async function runPlan(){const c=sheetCtx;if(!c.text.trim()){toast(T('Write what you want to get done','Skriv vad du vill hinna'));return}c.busy=true;renderSheet();const mon=S.week;await refresh([wKey(mon)]);if(calOn())await fetchEvents(mon);const EN=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const L=[];for(let i=0;i<7;i++){const d=addDays(mon,i);const ts=tasksOf(d);const ev=calOn()?eventsOn(d):[];L.push(`- ${i} ${EN[i]} ${dkey(d)}${d<today()?' (already past, do not plan here)':''}: ${ts.length} tasks already (${ts.map(x=>x.text).join('; ')||'none'})${ev.length?'; calendar: '+ev.map(x=>`${evTime(x)} ${x.title}`).join('; '):''}`)}
  const prompt=`You are the planning assistant in Vantor. Spread the user's wishes across the days of the week so that no day is overloaded. Respect existing tasks and the calendar. Do not plan on past days. Turn vague items into concrete short tasks (at most 6 words each) in ${LNG()}. If something is mentioned several times (for example "three workouts"), create that many tasks and spread them out.

Reply ONLY with JSON {"tasks":[{"day":0,"text":"..."}],"note":"one short sentence on your reasoning"} where day is 0 for Monday through 6 for Sunday.

THE WEEK:
${L.join('\n')}

WISHES:
${c.text.trim()}`;
  try{const res=await S.caps.sample.json(prompt,{modelTier:'default',cache:false});const list=((res&&res.tasks)||[]).filter(x=>Number.isInteger(x.day)&&x.day>=0&&x.day<7&&x.text).map(x=>({day:x.day,text:String(x.text).slice(0,120),pick:true})).sort((a,b)=>a.day-b.day);if(!list.length)throw {code:'empty'};c.result=list;c.note=res.note?String(res.note).slice(0,240):''}
  catch(e){toast(e&&e.code==='empty'?T('Nothing to plan. Try being more specific.','Inget att planera. Prova att vara mer konkret.'):aiError(e))}c.busy=false;if(sheet&&sheetMode==='plan')renderSheet()}

function onDaysScroll(){const dd=document.getElementById('days');const dots=document.getElementById('daydots');if(!dd||!dots)return;const c=dd.scrollLeft+dd.clientWidth/2;let best=0,bd=1e9;[...dd.children].forEach((el,i)=>{const m=el.offsetLeft-dd.offsetLeft+el.offsetWidth/2;const d=Math.abs(m-c);if(d<bd){bd=d;best=i}});[...dots.children].forEach((x,i)=>x.classList.toggle('on',i===best))}

/* training */
function lifeTraining(t){const mon=mondayOf(t);const D=TRN();const wk=sessionsBetween(mon,addDays(mon,6));const wkMin=wk.reduce((s,x)=>s+(+x.min||0),0);
  const sl=[];for(let i=0;i<7;i++){const v=D.sleep[dkey(addDays(t,-i))];if(v)sl.push(v)}const slAvg=sl.length?sl.reduce((a,b)=>a+b,0)/sl.length:0;
  const weeks=[];for(let i=7;i>=0;i--){const m=addDays(mon,-7*i);weeks.push(sessionsBetween(m,addDays(m,6)).reduce((s,x)=>s+(+x.min||0),0))}const mx=Math.max(60,...weeks);
  const pb={};D.sessions.forEach(s=>(s.sets||[]).forEach(x=>{if(!x.ex||!x.w)return;const k=x.ex.trim().toLowerCase();if(!pb[k]||x.w>pb[k].w||(x.w===pb[k].w&&(x.r||0)>(pb[k].r||0)))pb[k]={ex:x.ex.trim(),w:+x.w,r:+x.r||0,d:s.d}}));const pbs=Object.values(pb).sort((a,b)=>b.w-a.w).slice(0,8);
  const runs=D.sessions.filter(s=>s.km);const longest=runs.sort((a,b)=>b.km-a.km)[0];
  const slToday=D.sleep[dkey(t)]||0;const sl14=Array.from({length:14},(_,i)=>{const d=addDays(t,i-13);return [d,D.sleep[dkey(d)]||0]});
  const list=D.sessions.slice().sort((a,b)=>a.d<b.d?1:-1).slice(0,14);
  return `<div class="stats"><div class="stat"><span class="l">${T('Sessions this week','Pass denna vecka')}</span><span class="v num" data-cu="${wk.length}">${wk.length}</span><span class="s">${T('Last 8 weeks','Senaste 8 veckorna')}: ${sessionsBetween(addDays(mon,-49),addDays(mon,6)).length}</span></div>

/* reading & watching */
function lifeReading(t){const D=RD();const B=D.books;const yr=String(t.getFullYear());const fin=B.filter(b=>b.status==='done'&&(b.finished||'').startsWith(yr));
  let pm=0;for(let i=0;i<30;i++)pm+=pagesOn(dkey(addDays(t,-i)));const notes=[];B.forEach(b=>(b.notes||[]).forEach(n=>notes.push([b,n])));
  const grp=(st,l)=>{const L=B.filter(b=>b.status===st);return L.length?`<div class="card"><h3>${l}<span class="grow"></span><span class="aside num">${L.length}</span></h3><div class="books">${L.map(b=>bookEl(b)).join('')}</div></div>`:''};
  const W=D.watch||[];const wgrp=(st,l)=>{const L=W.filter(w=>w.status===st);return L.length?`<div class="card"><h3>${l}<span class="grow"></span><span class="aside num">${L.length}</span></h3><div class="books">${L.map(posterEl).join('')}</div></div>`:''};
  return `<div class="stats"><div class="stat"><span class="l">${T('Books finished','Lästa böcker')} ${yr}</span><span class="v num" data-cu="${fin.length}">${fin.length}</span><span class="s">${B.filter(b=>b.status==='reading').length} ${T('in progress','pågående')}</span></div>
    <div class="stat"><span class="l">${T('Pages, 30 days','Sidor, 30 dagar')}</span><span class="v num" data-cu="${pm}">${pm}</span><span class="s">${fmtN(pm/30)} ${T('per day','per dag')}</span></div>
    <div class="stat"><span class="l">${T('Saved notes','Sparade anteckningar')}</span><span class="v num">${notes.length}</span><span class="s">${T('One resurfaces on Today','En dyker upp på Idag')}</span></div>
    <div class="stat"><span class="l">${T('Watching','Tittar på')}</span><span class="v num">${W.filter(w=>w.status==='watching').length}</span><span class="s">${W.filter(w=>w.status==='done').length} ${T('finished','klara')}</span></div></div>
  <div class="sec-head"><h3>${T('Books','Böcker')}</h3><button class="btn small primary" data-act="x-new-book">+ ${T('Add book','Lägg till bok')}</button></div>
  ${grp('reading',T('Reading now','Läser nu'))}${grp('want',T('Up next','Härnäst'))}${grp('done',T('Finished','Utlästa'))}${B.length?'':`<div class="card"><p class="empty-note" style="margin:0">${T('Add the book you are reading. Log pages, save the lines that matter, and Vantor brings them back to you later.','Lägg till boken du läser. Logga sidor, spara raderna som betyder något, så tar Vantor fram dem igen senare.')}</p></div>`}
  <div class="sec-head"><h3>${T('Series & films','Serier & filmer')}</h3><button class="btn small" data-act="x-new-watch">+ ${T('Add','Lägg till')}</button></div>
  ${wgrp('watching',T('Watching now','Tittar nu'))}${wgrp('want',T('Watch list','Att se'))}${wgrp('done',T('Seen','Sett'))}`}

/* vision */
function lifeVision(){const B=S.cfg.board;const up=!!S.caps.assets;
  return `<div class="card vision-top"><p class="eyebrow">${T('One year from now','Om ett år')}</p><p class="vq">${esc(S.cfg.vision||T('Write your vision under Journey, and it shows here and on the big screen.','Skriv din vision under Resan, så visas den här och på storbilden.'))}</p>
    <div class="export"><button class="btn primary" data-act="x-show" ${B.length?'':'disabled'}>▶ ${T('Play fullscreen','Spela i helskärm')}</button><button class="btn" data-act="x-new-tile" data-k="img" ${up?'':'disabled title="'+T('Image upload needs edit access to Vantor','Bilduppladdning kräver redigeringsbehörighet till Vantor')+'"'}>+ ${T('Image','Bild')}</button><button class="btn" data-act="x-new-tile" data-k="txt">+ ${T('Words','Ord')}</button></div></div>
  ${B.length?`<div class="board-grid">${B.map((x,i)=>`<div class="vt-wrap">${tileEl(x,i)}<button class="del vdel" data-act="x-tile-del" data-id="${x.id}" aria-label="${T('Remove','Ta bort')}">×</button></div>`).join('')}</div>`:`<div class="card"><p class="empty-note" style="margin:0">${T('Add the place you want to live, the body you are building, the people you want around you, words you want to live by.','Lägg till platsen du vill bo på, kroppen du bygger, människorna du vill ha omkring dig, orden du vill leva efter.')}</p></div>`}`}

/* letters */
function lifeLetters(t){const L=S.cfg.letters.slice().sort((a,b)=>a.open<b.open?-1:1);const td=dkey(t);
  return `<div class="promo"><div><p class="eyebrow">${T('Letters','Brev')}</p><h3>${T('Write a letter to your future self','Skriv ett brev till ditt framtida jag')}</h3><p>${T('It stays locked until the date you choose.','Det förblir låst till datumet du väljer.')}</p></div><button class="btn primary lg" data-act="x-new-letter">${T('Write a letter','Skriv ett brev')}</button></div>
  ${L.length?`<div class="envs">${L.map(l=>{const ready=l.open<=td;const dl=daysBetween(t,parseD(l.open));return `<button class="env${ready&&!l.opened?' ready':''}${l.opened?' opened':''}" data-act="x-letter-open" data-id="${l.id}" data-cur="${ready?T('Open','Öppna'):T('Sealed','Förseglat')}"><span class="seal">${l.opened?'✓':'A'}</span><b>${T('Written','Skrivet')} ${shortDate(parseD(l.written))} ${parseD(l.written).getFullYear()}</b><small>${l.opened?T('Opened','Öppnat'):ready?T('Ready to open','Redo att öppnas'):T(`Opens in ${dl} days`,`Öppnas om ${dl} dagar`)}</small></button>`}).join('')}</div>`:''}`}

/* decisions */
function lifeDecisions(t){const D=S.cfg.decisions.slice().sort((a,b)=>a.d<b.d?1:-1);const td=dkey(t);const rated=D.filter(d=>d.rating);const good=rated.filter(d=>d.rating>=4).length;
  return `<div class="stats"><div class="stat"><span class="l">${T('Decisions logged','Loggade beslut')}</span><span class="v num">${D.length}</span><span class="s">${D.filter(d=>!d.outcome).length} ${T('open','öppna')}</span></div>
    <div class="stat"><span class="l">${T('Reviewed','Utvärderade')}</span><span class="v num">${rated.length}</span><span class="s">${D.filter(d=>!d.outcome&&d.review<=td).length} ${T('due now','att göra nu')}</span></div>
    <div class="stat"><span class="l">${T('Turned out well','Blev bra')}</span><span class="v num">${rated.length?pct(good,rated.length)+'<small>%</small>':'–'}</span><span class="s">${T('rated 4 or 5','betyg 4 eller 5')}</span></div>
    <div class="stat"><span class="l">${T('Avg. confidence','Snitt säkerhet')}</span><span class="v num">${D.length?fmtN(D.reduce((s,d)=>s+(+d.conf||0),0)/D.length):'–'}<small>/5</small></span><span class="s">${T('when you decided','när du bestämde')}</span></div></div>
  <div class="sec-head"><h3>${T('Decision journal','Beslutsjournal')}</h3><button class="btn small primary" data-act="x-new-dec">+ ${T('New decision','Nytt beslut')}</button></div>
  <div class="card">${D.length?D.map(d=>{const due=!d.outcome&&d.review<=td;return `<div class="dec"><div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><b>${esc(d.title)}</b><span class="grow"></span>${d.outcome?`<span class="stars">${[1,2,3,4,5].map(v=>`<i class="${v<=d.rating?'f':''}"></i>`).join('')}</span>`:due?`<button class="btn small primary" data-act="x-dec-review" data-id="${d.id}">${T('Review now','Utvärdera nu')}</button>`:`<span class="chip alt">${T('Review','Uppföljning')} ${shortDate(parseD(d.review))}</span>`}<button class="del" data-act="x-dec-del" data-id="${d.id}" aria-label="${T('Delete','Ta bort')}">×</button></div>
    ${d.choice?`<small>${T('Chose','Valde')}: ${esc(d.choice)}${d.why?' · '+esc(d.why):''}</small>`:''}${d.expect?`<small>${T('Expected','Förväntade')}: ${esc(d.expect)} · ${T('confidence','säkerhet')} ${d.conf}/5</small>`:''}${d.outcome?`<small style="color:var(--ink)">${T('What happened','Vad hände')}: ${esc(d.outcome)}</small>`:''}</div>`}).join(''):`<p class="empty-note" style="margin:0">${T('Write down big choices before you know how they turn out. In a month you review, and over time you learn how good your judgement really is.','Skriv ner stora val innan du vet hur de slutar. Om en månad utvärderar du, och med tiden lär du dig hur bra ditt omdöme egentligen är.')}</p>`}</div>`}

      else if(h.target>2&&Math.max(...ws)<=h.target-3&&ws.some(c=>c>0)){const nv=Math.max(1,Math.max(...ws)+1);add('down-'+h.id,{ic:'↓',sc:'var(--amber)',p:5,html:T(`${hn(h)} has been at ${ws.join(', ')} of ${h.target} lately. A smaller target you actually hit builds more than a big one you miss.`,`${hn(h)} har legat på ${ws.join(', ')} av ${h.target} på sistone. Ett mindre mål du faktiskt når bygger mer än ett stort du missar.`),acts:[['x-target',T(`Set to ${nv}`,`Sätt till ${nv}`),'',{h:h.id,v:nv}]]})}});
    if(hr>=17&&!isRest(t))H.forEach(h=>{const st=streak(h.id);if(st>=3&&!isDone(h.id,t))add('risk-'+h.id+'-'+td,{ic:'!',sc:'var(--neg)',p:8,html:T(`Your ${st}-day streak on ${hn(h)} ends tonight unless you do it.`,`Din svit på ${st} dagar med ${hn(h)} tar slut ikväll om du inte gör den.`),acts:[]})});

function weekWins(mon){const H=S.cfg.habits;const L=[];const wk=H.reduce((s,h)=>s+Math.min(h.target,weekCount(h.id,mon)),0),wg=H.reduce((s,h)=>s+h.target,0);

function yearStats(y){const H=S.cfg.habits;let comp=0,days=0,perfect=0;const t=today();for(let m=0;m<12;m++){if(!isLoaded(mKey(y,m)))continue;const md=MD(y,m);const n=new Date(y,m+1,0).getDate();for(let d=1;d<=n;d++){const dt=new Date(y,m,d);if(dt>t)break;let k=0;H.forEach(h=>{if(okv(h,(md.checks[h.id]||{})[d]||0))k++});comp+=k;if(k)days++;if(H.length&&k===H.length)perfect++}}

function fcBase(){const M=S.cfg.money||{};const t=today();const nw=S.cfg.networth.slice().sort((a,b)=>a.d<b.d?-1:1);const saved=S.cfg.savings.reduce((s,g)=>s+(+g.saved||0),0);

function tradeGuard(p,d){const ex=p.extra||{};const tk=dkey(today());const td=d.trades.filter(x=>x.d===tk).sort((a,b)=>(a.tm||'')<(b.tm||'')?-1:1);const out=[];const mt=+ex.maxTrades||0;

  const last=td[td.length-1];const cd=+ex.cooldown||15;if(last&&last.pnl<0&&last.tm){const [h,m]=last.tm.split(':').map(Number);const until=new Date();until.setHours(h,m+cd,0,0);if(until>new Date())out.push(['amber',T(`Cooldown after a loss. No new trade before <b>${hm(until)}</b>.`,`Paus efter en förlust. Ingen ny trade före <b>${hm(until)}</b>.`)])}

function propState(p,d){const P=(p.extra||{}).prop;if(!P||!P.on)return null;const tr=d.trades.filter(x=>x.d>=(P.start||'0')).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:(a.tm||'')<(b.tm||'')?-1:1);

function groupStats(tr,key){const m={};tr.forEach(x=>{const k=key(x);if(k==null||k==='')return;(m[k]=m[k]||[]).push(x)});return Object.entries(m).map(([k,a])=>{const n=a.length,w=a.filter(x=>x.pnl>0).length,net=a.reduce((s,x)=>s+x.pnl,0);const rs=a.filter(x=>x.r!=null&&!isNaN(x.r));return {k,n,win:w/n,net,avgR:rs.length?rs.reduce((s,x)=>s+x.r,0)/rs.length:null}})}

function seasonMetric(k,a,b){const A=dkey(a),B=dkey(b);const t=today();let n=0;const H=S.cfg.habits;
  const eachDay=f=>{for(let d=new Date(a);d<=b&&d<=t;d=addDays(d,1))f(d)};
  if(k==='checks')eachDay(d=>H.forEach(h=>{if(isDone(h.id,d))n++}));
  if(k==='perfect')eachDay(d=>{if(H.length&&H.every(h=>isDone(h.id,d)))n++});
  if(k==='journal')eachDay(d=>{const md=MDd(d);if(md.journal[d.getDate()]||md.checkin[d.getDate()])n++});
  if(k==='sessions')n=TRN().sessions.filter(s=>s.d>=A&&s.d<=B).length;
  if(k==='sleep')n=Object.keys(TRN().sleep).filter(x=>x>=A&&x<=B).length;
  if(k==='tx'){for(let m=a.getMonth();m<=b.getMonth();m++)n+=FD(new Date(a.getFullYear(),m,1)).tx.length}
  if(k==='nw')n=S.cfg.networth.filter(x=>x.d>=A&&x.d<=B).length;
  if(k==='decisions')n=S.cfg.decisions.filter(x=>x.d>=A&&x.d<=B).length;

function parseCSV(txt){txt=String(txt||'').replace(/^﻿/,'');const first=txt.split(/\r?\n/).find(l=>l.trim())||'';const cnt=c=>(first.match(new RegExp('\\'+c,'g'))||[]).length;const del=[';','\t',',','|'].sort((a,b)=>cnt(b)-cnt(a))[0]||',';
  const rows=[];let row=[],cur='',q=false;for(let i=0;i<txt.length;i++){const ch=txt[i];if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch==='"')q=true;else if(ch===del){row.push(cur);cur=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else cur+=ch}
  row.push(cur);if(row.some(x=>x.trim()))rows.push(row);return rows.map(r=>r.map(x=>x.trim()))}
function pNum(s){s=String(s||'').replace(/[^\d,.\-−+]/g,'').replace('−','-');if(!s)return NaN;const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');if(lc>ld){s=s.replace(/\./g,'').replace(',','.')}else s=s.replace(/,/g,'');return parseFloat(s)}
function pDate(s){s=String(s||'').trim();let m=s.match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);if(m)return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;m=s.match(/(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/);if(m){let a=+m[1],b=+m[2];const mo=a>12?b:b>12?a:(LANG==='sv'||CUR()==='SEK'||CUR()==='EUR'?b:a);const da=mo===a?b:a;return `${m[3]}-${pad(mo)}-${pad(da)}`}return ''}
function pTime(s){const m=String(s||'').match(/(\d{1,2}):(\d{2})/);return m?`${pad(+m[1])}:${m[2]}`:''}
function findCol(head,keys){const h=head.map(x=>x.toLowerCase());for(const k of keys){const i=h.findIndex(x=>x.includes(k));if(i>=0)return i}return -1}

const AMB={on:false,nodes:null};

    const len=ac.sampleRate*4;const buf=ac.createBuffer(2,len,ac.sampleRate);for(let c=0;c<2;c++){const d=buf.getChannelData(c);let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.2}}
    const src=ac.createBufferSource();src.buffer=buf;src.loop=true;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=900;const g=ac.createGain();g.gain.value=0;src.connect(f);f.connect(g);g.connect(ac.destination);src.start();g.gain.linearRampToValueAtTime(.35,ac.currentTime+1.2);AMB.nodes={src,g};AMB.on=true}

const CAN_NET=!(window.claude&&window.claude.use);
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()}
const https_=u=>u?String(u).replace(/^http:/,'https:'):'';
async function searchBooks(q){const out=[];
  try{const j=await getJSON('https://www.googleapis.com/books/v1/volumes?maxResults=8&printType=books&q='+encodeURIComponent(q));(j.items||[]).forEach(it=>{const v=it.volumeInfo||{};const img=v.imageLinks&&(v.imageLinks.thumbnail||v.imageLinks.smallThumbnail);if(!v.title)return;out.push({title:v.title+(v.subtitle&&v.subtitle.length<40?': '+v.subtitle:''),author:(v.authors||[])[0]||'',pages:v.pageCount||0,year:(v.publishedDate||'').slice(0,4),cover:img?https_(img).replace('&edge=curl','').replace('zoom=1','zoom=1'):''})})}catch(e){}
  if(out.filter(x=>x.cover).length<2){try{const j=await getJSON('https://openlibrary.org/search.json?limit=8&fields=title,author_name,cover_i,number_of_pages_median,first_publish_year&q='+encodeURIComponent(q));(j.docs||[]).forEach(d=>out.push({title:d.title,author:(d.author_name||[])[0]||'',pages:d.number_of_pages_median||0,year:d.first_publish_year||'',cover:d.cover_i?`https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg`:''}))}catch(e){}}

function propStateA(a,tr){if(!a.prop)return null;const P=a.prop;const T2=tr.filter(x=>x.d>=(P.start||'0')).sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:(x.tm||'')<(y.tm||'')?-1:1);const size=+a.size||0;let eq=size,peak=size,mdd=0;const days=new Set();
  T2.forEach(x=>{eq+=x.pnl;days.add(x.d);peak=Math.max(peak,eq);mdd=Math.max(mdd,(P.trailing?peak:size)-eq)});const tk=dkey(today());const dayNet2=T2.filter(x=>x.d===tk).reduce((s,x)=>s+x.pnl,0);const profit=eq-size;

  return {P,eq,dd:Math.max(0,(P.trailing?peak:size)-eq),dayNet:dayNet2,profit,days:days.size,breached,passed}}

function calcRisk(){const g=id=>parseFloat(String((document.getElementById(id)||{}).value||'').replace(',','.'));const out=document.getElementById('rc-out');if(!out)return;const cp=g('rc-cap'),r=g('rc-risk'),en=g('rc-entry'),st=g('rc-stop');
  const insK=(document.getElementById('rc-inst')||{}).value||'custom';const I=INSTR().find(x=>x[0]===insK)||INSTR()[0];const fx=CUR()==='USD'?1:(g('rc-fx')||0);
  if(!(cp>0&&r>0&&en>0&&st>0&&en!==st)){out.innerHTML=T('Choose the market and fill in account, risk, entry and stop.','Välj marknad och fyll i konto, risk, entry och stop.');return}
  const riskAmt=cp*r/100;const dist=Math.abs(en-st);let perUnit;
  if(I[0]==='custom'||I[0]==='crypto')perUnit=dist;else if(I[0]==='fxjpy')perUnit=dist*100000/en*(fx||1);else perUnit=dist*I[2]*(fx||1);
  if(I[0]!=='custom'&&I[0]!=='crypto'&&CUR()!=='USD'&&!fx){out.innerHTML=T('Enter the USD rate so the size is right in your currency.','Fyll i dollarkursen så blir storleken rätt i din valuta.');return}
  const size=riskAmt/perUnit;const unit={unit:T('units','st'),lot:T('lots','lots'),contract:T('contracts','kontrakt'),coin:T('coins','mynt')}[I[3]];const shown=I[3]==='contract'?Math.floor(size):I[3]==='lot'?Math.floor(size*100)/100:Math.floor(size*1e4)/1e4;
  out.innerHTML=T(`Risk <b>${money(riskAmt)}</b> · position <b class="num">${fmtN(shown)}</b> ${unit}${I[3]==='contract'&&size<1?' · <span class="neg">too big for this account, use a micro</span>':''}`,`Risk <b>${money(riskAmt)}</b> · position <b class="num">${fmtN(shown)}</b> ${unit}${I[3]==='contract'&&size<1?' · <span class="neg">för stor för kontot, använd micro</span>':''}`)}

/* ---- import with platform presets ---- */
const IMP_KEYS={
  date:['exit time','close time','closing time','closed','soldtimestamp','sold timestamp','close date','tradedate','trade date','date/time','datetime','date','datum','time'],
  open:['entry time','open time','boughttimestamp','bought timestamp','opening time'],
  pnl:['net p&l','realized p&l','fifopnlrealized','profit','p&l','pnl','net profit','resultat','result','net'],
  sym:['instrument','symbol','ticker','item','contract','market'],
  side:['market pos.','market pos','side','direction','type','buy/sell','action','riktning'],
  qty:['qty','quantity','size','volume','lots','contracts','antal'],
  entry:['entry price','open price','buyprice','buy price','fill price','avg entry','price'],
  exit:['exit price','close price','sellprice','sell price','avg exit'],
  fee:['commission','commissions','fees','fee','ibcommission','courtage'],swap:['swap']};
async function importTrades(pid,file){const p=projById(pid);if(!p)return;const R=parseCSV(await file.text());if(R.length<2){toast(T('Could not read that file','Kunde inte läsa filen'));return}
  let hi=R.findIndex(r=>findCol(r,IMP_KEYS.pnl)>=0&&findCol(r,IMP_KEYS.date.concat(IMP_KEYS.open))>=0);if(hi<0)hi=0;const H=R[hi].map(x=>x.toLowerCase());
  const col=k=>findCol(H,IMP_KEYS[k]);const cD=col('date'),cO=col('open'),cP=col('pnl'),cS=col('sym'),cDir=col('side'),cQ=col('qty'),cE=col('entry'),cX=col('exit'),cF=col('fee'),cW=col('swap'),cSt=findCol(H,['setup','strategy','tag','strategi']);
  if((cD<0&&cO<0)||cP<0){toast(T('Need a date column and a P&L column','Behöver en datumkolumn och en P&L-kolumn'));return}
  const d=PD(pid);const acct=tAcct(p)==='all'?'main':tAcct(p);let added=0,dup=0;
  R.slice(hi+1).forEach(r=>{const ds=r[cD>=0?cD:cO];const dd=pDate(ds);let pnl=pNum(r[cP]);if(!dd||isNaN(pnl))return;const fee=cF>=0?Math.abs(pNum(r[cF])||0):0,sw=cW>=0?(pNum(r[cW])||0):0;
    const netGiven=/net|fifo/.test(H[cP]);if(!netGiven)pnl=pnl-fee+sw;pnl=Math.round(pnl*100)/100;
    const tm=pTime(cO>=0?r[cO]:ds),xtm=pTime(ds);const sym=cS>=0?String(r[cS]||'').toUpperCase().slice(0,20):'';
    if(d.trades.some(x=>x.d===dd&&Math.abs(x.pnl-pnl)<.01&&(x.sym||'')===sym&&(x.tm||'')===tm)){dup++;return}
    const dirRaw=cDir>=0?String(r[cDir]||''):'';const dir=/sell|short|sälj/i.test(dirRaw)?'Short':'Long';
    d.trades.push({id:uid(),d:dd,tm,xtm:cO>=0?xtm:'',sym,dir,pnl,size:cQ>=0?Math.abs(pNum(r[cQ]))||null:null,entry:cE>=0?pNum(r[cE])||null:null,exit:cX>=0?pNum(r[cX])||null:null,fees:fee||null,setup:cSt>=0?String(r[cSt]||'').slice(0,40):'',emo:'',rules:true,note:'',imp:1,acct});added++});
  savePD(pid);sfx('coin');toast(T(`${added} trades imported${dup?`, ${dup} duplicates skipped`:''}`,`${added} trades importerade${dup?`, ${dup} dubbletter hoppades över`:''}`));render(false)}

const SHOTS={cache:{}};
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('arete-shots',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbPut(k,blob){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('s','readwrite');tx.objectStore('s').put(blob,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('s');const q=tx.objectStore('s').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function shrink(file){try{const bmp=await createImageBitmap(file);const sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',.82))}catch(e){return file}}
async function putShot(file){const blob=await shrink(file);
  if(S.caps.assets){const r=await S.caps.assets.upload(blob);return 'u:'+r.url}
  if(S.sb&&S.cloudUser){const path=`${S.cloudUser.id}/${uid()}${Date.now().toString(36)}.jpg`;const {error}=await S.sb.storage.from('shots').upload(path,blob,{contentType:'image/jpeg'});if(!error)return 'sb:'+path}
  const k=uid()+Date.now().toString(36);await idbPut(k,blob);return 'idb:'+k}
async function shotURL(ref){if(!ref)return '';if(SHOTS.cache[ref])return SHOTS.cache[ref];let u='';
  try{if(ref.startsWith('u:'))u=ref.slice(2);else if(ref.startsWith('sb:')&&S.sb){const {data}=await S.sb.storage.from('shots').createSignedUrl(ref.slice(3),3600);u=data&&data.signedUrl||''}else if(ref.startsWith('idb:')){const b=await idbGet(ref.slice(4));if(b)u=URL.createObjectURL(b)}}catch(e){}
  if(u)SHOTS.cache[ref]=u;return u}
function hydrateShots(root){(root||document).querySelectorAll('img[data-shot]:not([src])').forEach(async im=>{const u=await shotURL(im.dataset.shot);if(u)im.src=u;else im.classList.add('missing')})}

function zoned(y,m,d,h,mi,tz){let ts=Date.UTC(y,m,d,h,mi);for(let i=0;i<2;i++){const p=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(new Date(ts)).reduce((o,x)=>(o[x.type]=x.value,o),{});const asUTC=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute);ts+=Date.UTC(y,m,d,h,mi)-asUTC}return new Date(ts)}

function sessionSpans(){const now=new Date();const out=[];SESSIONS().forEach(([k,l,tz,h1,m1,h2,m2,c])=>{for(const off of [-1,0,1]){const base=addDays(today(),off);const s=zoned(base.getFullYear(),base.getMonth(),base.getDate(),h1,m1,tz);const e=zoned(base.getFullYear(),base.getMonth(),base.getDate(),h2,m2,tz);const wd=new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'short'}).format(s);if(wd==='Sat'||wd==='Sun')continue;out.push({k,l,s,e,c,open:now>=s&&now<e})}});return out}

  const pctOf=t=>Math.max(0,Math.min(100,(t-d0)/864000));const nowP=pctOf(now);

  if(!confirmRestore())return;Object.keys(localStorage).filter(k=>k.startsWith('stigen:')).forEach(k=>localStorage.removeItem(k));ks.forEach(k=>localStorage.setItem(k,j.data[k]));location.reload()}catch(e){toast(T('That is not an Vantor backup file','Det där är ingen säkerhetskopia från Vantor'))}}
function confirmRestore(){const b=document.querySelector('[data-sa="x-restore-arm"]');if(b&&b.dataset.armed)return true;toast(T('Choose the file again to confirm: this replaces everything on this device.','Välj filen igen för att bekräfta: det ersätter allt på den här enheten.'));if(b)b.dataset.armed='1';return false}
document.addEventListener('change',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.restore!=null){const f=t.files&&t.files[0];if(f)restoreBackup(f);t.value=''}},true);
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-sa="x-backup"]');if(b){e.stopPropagation();saveBackup()}},true);
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
function backupNudge(){if(S.cloudUser)return '';const lb=S.cfg.flags.lastBackup||(S.cfg.profile&&S.cfg.profile.created);const n=lb?daysBetween(parseD(lb),today()):0;if(S.cfg.example||!S.cfg.flags.interviewed||n<14)return '';

function sbCollection(sb,uid){return {doc(k){return {
  async get(){const {data,error}=await sb.from('docs').select('data').eq('user_id',uid).eq('key',k).maybeSingle();if(error)throw error;return {exists:!!data,data:()=>data?data.data:null}},
  async set(v){const {error}=await sb.from('docs').upsert({user_id:uid,key:k,data:v,updated_at:new Date().toISOString()},{onConflict:'user_id,key'});if(error)throw error}}}}}
function localKeys(){const L=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('stigen:')){const kk=k.slice(7);if(!LOCAL_ONLY.has(kk))L.push(kk)}}return L}
async function attachCloud(user){if(!user||(S.cloudUser&&S.cloudUser.id===user.id&&Store.col))return;S.cloudUser=user;S.meId=user.id;setSync('saving');
  try{const col=sbCollection(S.sb,user.id);const snap=await col.doc('config').get();Store.col=col;
    if(snap.exists){Store.migrate=false;Object.keys(Store.pending).forEach(k=>Store.cancel(k));S.cfg=normCfg(clone(snap.data()));Store.lsSet('config',S.cfg)}
    else{Store.migrate=true;const rows=localKeys().map(k=>({user_id:user.id,key:k,data:Store.lsGet(k),updated_at:new Date().toISOString()})).filter(r=>r.data!=null);
      for(let i=0;i<rows.length;i+=200){const {error}=await S.sb.from('docs').upsert(rows.slice(i,i+200),{onConflict:'user_id,key'});if(error)throw error}}
    S.docs={};S.loaded=new Set();setSync('ok');afterConfig();

async function initCloud(){if(!cloudReady())return;try{S.sb=window.supabase.createClient(CLOUD.url,CLOUD.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

async function cloudAuth(mode,email,pw,out){email=(email||'').trim();if(!email||!pw||pw.length<6){out(T('Enter your email and a password of at least 6 characters.','Fyll i e-post och ett lösenord på minst 6 tecken.'));return}
  out(T('One moment…','Ett ögonblick…'),true);
  try{if(mode==='signup'){const {data,error}=await S.sb.auth.signUp({email,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;
      if(!data.session){out(T('Almost done. Open the email we sent you, confirm, then log in here.','Nästan klart. Öppna mejlet vi skickade, bekräfta, och logga sedan in här.'),true);return}
      S.cloudToast=T('Account created. Your data is now synced.','Kontot är skapat. Din data synkas nu.')}
    else{const {error}=await S.sb.auth.signInWithPassword({email,password:pw});if(error)throw error;S.cloudToast=T('Logged in. Your data is synced.','Inloggad. Din data synkas.')}
    if(sheet)closeSheet();const {data}=await S.sb.auth.getSession();if(data&&data.session)attachCloud(data.session.user)}

async function cloudReset(email,out){email=(email||'').trim();if(!email){out(T('Enter your email first.','Fyll i din e-post först.'));return}try{const {error}=await S.sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;out(T('We sent you a link to choose a new password.','Vi har skickat en länk där du väljer nytt lösenord.'),true)}catch(e){out(String(e.message||e))}}
async function cloudSignOut(){flushAll();try{await S.sb.auth.signOut()}catch(e){}Object.keys(localStorage).filter(k=>k.startsWith('stigen:')).forEach(k=>localStorage.removeItem(k));location.reload()}

const FX={ac:null,parts:[],raf:0,cv:null,cx:null,mx:-100,my:-100,rx:-100,ry:-100,dot:null,ring:null,cursor:false,reduce:false};
function fxPrefs(){const f=(S.cfg&&S.cfg.flags)||{};FX.reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fine=window.matchMedia('(hover:hover) and (pointer:fine)').matches;FX.cursor=fine&&!f.nocursor&&!FX.reduce;document.documentElement.classList.toggle('cursor-on',FX.cursor);
  if(FX.dot){FX.dot.hidden=!FX.cursor;FX.ring.hidden=!FX.cursor}}
function vib(p){try{if(navigator.vibrate&&!S.cfg.flags.mute)navigator.vibrate(p)}catch(e){}}
/* sound: tiny synthesized cues, no files */
function audio(){if(!FX.ac){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;try{FX.ac=new A()}catch(e){return null}}if(FX.ac.state==='suspended')FX.ac.resume().catch(()=>{});return FX.ac}
function tone(f,dur,{type='sine',vol=.08,at=0,slide=0}={}){const ac=audio();if(!ac)return;const t0=ac.currentTime+at;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.006);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+dur+.02)}
function noise(dur,vol=.05,hp=2000){const ac=audio();if(!ac)return;const n=Math.floor(ac.sampleRate*dur);const b=ac.createBuffer(1,n,ac.sampleRate);const d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=ac.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(ac.destination);s.start()}
function sfx(k){if(!S.cfg||S.cfg.flags.mute)return;try{switch(k){
  case 'tick':tone(1320,.06,{type:'triangle',vol:.06});tone(1980,.05,{type:'sine',vol:.03,at:.03});break;
  case 'untick':tone(660,.07,{type:'triangle',vol:.04,slide:.7});break;
  case 'click':noise(.025,.05,3500);break;
  case 'pop':tone(520,.09,{type:'sine',vol:.08,slide:2.2});break;
  case 'coin':tone(988,.07,{type:'square',vol:.025});tone(1319,.18,{type:'square',vol:.025,at:.07});break;
  case 'done':[523,659,784].forEach((f,i)=>tone(f,.22,{type:'triangle',vol:.05,at:i*.06}));break;
  case 'chord':[523,659,784,1047].forEach((f,i)=>tone(f,.9,{type:'sine',vol:.05,at:i*.07}));tone(2093,.5,{type:'triangle',vol:.02,at:.3});break;
  case 'level':[392,523,659,784,1047].forEach((f,i)=>tone(f,.35,{type:'triangle',vol:.05,at:i*.08}));break;
  case 'whoosh':noise(.35,.05,600);break;
  case 'seal':tone(180,.25,{type:'sine',vol:.12,slide:.5});noise(.08,.04,1200);break;
  case 'nope':tone(220,.08,{type:'square',vol:.03});tone(196,.12,{type:'square',vol:.03,at:.09});break;
  case 'tab':tone(880,.035,{type:'sine',vol:.025});break;
}}catch(e){}}
/* confetti */
function fxCanvas(){if(!FX.cv){FX.cv=document.getElementById('fx');if(!FX.cv)return null;FX.cx=FX.cv.getContext('2d');const rs=()=>{const r=devicePixelRatio||1;FX.cv.width=innerWidth*r;FX.cv.height=innerHeight*r;FX.cx.setTransform(r,0,0,r,0,0)};rs();addEventListener('resize',rs)}return FX.cx}
function fxColors(){try{if(totalLevel().lvl>=8)return ['#FFD36B','#E8B04B','#FFF1C2','#C9922E','#FFFFFF']}catch(e){}const cs=getComputedStyle(document.documentElement);return ['--moss','--amber','--sky','--lingon','--heather','--sand','--ink'].map(v=>cs.getPropertyValue(v).trim()).filter(Boolean)}
function burst(x,y,n=24,power=1){if(FX.reduce||!S.cfg||S.cfg.flags.noconfetti||!fxCanvas())return;const C=fxColors();for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=(2+Math.random()*6)*power;FX.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3*power,g:.22,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,w:4+Math.random()*5,h:6+Math.random()*8,c:C[i%C.length],life:60+Math.random()*40,shape:Math.random()<.3?'c':'r'})}loopFx()}
function rain(){if(FX.reduce||!S.cfg||S.cfg.flags.noconfetti||!fxCanvas())return;const C=fxColors();for(let i=0;i<160;i++){FX.parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,g:.05,r:Math.random()*6,vr:(Math.random()-.5)*.25,w:5+Math.random()*5,h:8+Math.random()*10,c:C[i%C.length],life:200+Math.random()*80,shape:Math.random()<.25?'c':'r',sway:Math.random()*6})}
  burst(innerWidth*.15,innerHeight*.85,40,1.6);burst(innerWidth*.85,innerHeight*.85,40,1.6)}
function loopFx(){if(FX.raf)return;const step=()=>{const x=FX.cx;x.clearRect(0,0,innerWidth,innerHeight);FX.parts=FX.parts.filter(p=>p.life>0&&p.y<innerHeight+40);
    FX.parts.forEach(p=>{p.vy+=p.g;p.vx*=.99;p.x+=p.vx+(p.sway?Math.sin(p.life/12)*.6:0);p.y+=p.vy;p.r+=p.vr;p.life--;x.save();x.globalAlpha=Math.min(1,p.life/30);x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;if(p.shape==='c'){x.beginPath();x.arc(0,0,p.w/2,0,7);x.fill()}else{x.scale(1,Math.cos(p.life/6));x.fillRect(-p.w/2,-p.h/2,p.w,p.h)}x.restore()});
    if(FX.parts.length)FX.raf=requestAnimationFrame(step);else{FX.raf=0;x.clearRect(0,0,innerWidth,innerHeight)}};FX.raf=requestAnimationFrame(step)}
/* cursor */
function initCursor(){FX.dot=document.createElement('div');FX.dot.className='cur-dot';FX.ring=document.createElement('div');FX.ring.className='cur-ring';FX.ring.innerHTML='<span></span>';document.body.append(FX.dot,FX.ring);
  addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;FX.mx=e.clientX;FX.my=e.clientY;FX.dot.style.transform=`translate(${FX.mx}px,${FX.my}px)`;
    const el=e.target.closest&&e.target.closest('button,a,[data-act],label.check,.pk,select');const txt=e.target.closest&&e.target.closest('input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]),textarea');
    FX.ring.classList.toggle('hov',!!el&&!txt);FX.ring.classList.toggle('txt',!!txt);FX.dot.style.opacity=txt?0:1;const lab=el&&el.dataset.cur;FX.ring.firstChild.textContent=lab||''},{passive:true});
  addEventListener('pointerdown',()=>FX.ring.classList.add('down'));addEventListener('pointerup',()=>FX.ring.classList.remove('down'));
  document.addEventListener('mouseleave',()=>{FX.dot.style.opacity=0;FX.ring.style.opacity=0});document.addEventListener('mouseenter',()=>{FX.dot.style.opacity=1;FX.ring.style.opacity=''});

/* magnetic buttons and tilt */
function initMagnet(){addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||FX.reduce)return;const b=e.target.closest&&e.target.closest('.btn.primary,.icon-btn,.avatar,.brand');document.querySelectorAll('.mag').forEach(x=>{if(x!==b){x.classList.remove('mag');x.style.translate=''}});

function bindTilt(root){if(!root||FX.reduce||!window.matchMedia('(hover:hover)').matches)return;root.querySelectorAll('[data-tilt],.book,.poster,.env,.cover').forEach(el=>{if(el._tilt)return;el._tilt=1;const max=el.classList.contains('cover')?2.5:7;
  el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect();const px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;el.style.transform=`perspective(900px) rotateX(${(-py*max).toFixed(2)}deg) rotateY(${(px*max).toFixed(2)}deg) translateZ(0)`;el.style.setProperty('--gx',(px+.5)*100+'%');el.style.setProperty('--gy',(py+.5)*100+'%')});

/* count up */
function countUp(root){if(!root||FX.reduce)return;root.querySelectorAll('[data-cu]').forEach(el=>{const to=+el.dataset.cu;if(!isFinite(to)||!to)return;const fm=el.dataset.fmt;const html=el.innerHTML;const t0=performance.now(),D=900;
  const f=n=>fm==='money'?money(n):String(Math.round(n));const step=now=>{const k=Math.min(1,(now-t0)/D);const e=1-Math.pow(1-k,4);if(k<1){el.textContent=f(to*e);requestAnimationFrame(step)}else el.innerHTML=html};requestAnimationFrame(step)})}

  setTimeout(()=>document.addEventListener('click',moreAway,true),0)}
function moreAway(e){if(!e.target.closest('#more')&&!e.target.closest('#tab-more'))closeMore()}
function closeMore(){const el=document.getElementById('more');if(el)el.remove();document.removeEventListener('click',moreAway,true)}
/* clocks */
function tickClocks(){const n=new Date();const h=n.getHours(),m=n.getMinutes(),s=n.getSeconds();const hc=document.getElementById('hclock');if(hc)hc.innerHTML=`${pad(h)}<b>:</b>${pad(m)}`;const dc=document.getElementById('dclock');if(dc)dc.textContent=`${pad(h)}:${pad(m)}:${pad(s)}`;
  const set=(id,deg)=>{const el=document.getElementById(id);if(el)el.setAttribute('transform',`rotate(${deg} 50 50)`)};set('ac-h',(h%12)*30+m*.5);set('ac-m',m*6+s*.1);set('ac-s',s*6);if(s===0&&S.cfg&&S.cfg.skin==='auto')applyAccent()}
/* feedback on actions: runs after the main click handler re-rendered */
const FX_ACTS={htoday:'h',toggle:'h',ttog:'id',ctog:'id','ms-tog':'id','pc-tog':'id','lesson-done':'id','sc-tog':'id','pre-tog':'i'};
function onFxClick(e){const b=e.target.closest('[data-act]');if(!b){const anyB=e.target.closest&&e.target.closest('button,.btn,a[href],.opt,label.check,label.upl-btn');if(anyB&&!anyB.closest('[data-sa="x-snd"],[data-sa="x-cel"]'))sfx('key');return}const a=b.dataset.act;
  if(a==='tab'){sfx('tab');return}
  if(a==='cstep'){sfx(b.dataset.v>0?'tick':'untick');vib(6);const h=habitById(b.dataset.h);if(h&&b.dataset.v>0&&val(h.id,today())===h.goal)burst(e.clientX,e.clientY,22);return}
  if(a==='drate'||a==='rate'){sfx('click');return}
  if(a==='hrs'){sfx('coin');burst(e.clientX,e.clientY,14,.7);return}
  const key=FX_ACTS[a];if(!key){sfx('key');return}
  const sel=`[data-act="${a}"][data-${key}="${CSS.escape(b.dataset[key]||'')}"]`+(b.dataset.date?`[data-date="${b.dataset.date}"]`:'');const nb=document.querySelector(sel)||b;
  const on=nb.classList.contains('on')||nb.getAttribute('aria-pressed')==='true'||(a==='lesson-done'&&/✓/.test(nb.textContent));
  if(on){if(a==='htoday'||a==='toggle')chainNext(b.dataset.h);sfx('tick');vib(8);burst(e.clientX||innerWidth/2,e.clientY||innerHeight/2,a==='ms-tog'?40:20);const row=nb.closest('.row,.task,li');if(row){row.classList.remove('pulse-on');void row.offsetWidth;row.classList.add('pulse-on')}}else sfx('untick')}
function ripple(e){if(FX.reduce||e.button!==0)return;const r=document.createElement('span');r.className='ripple';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),600)}
function initFx(){fxPrefs();if(window.matchMedia('(hover:hover) and (pointer:fine)').matches)initCursor();fxPrefs();initMagnet();
  document.addEventListener('click',onFxClick);document.addEventListener('pointerdown',ripple,{passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeShow();closeMore()}});
  addEventListener('resize',()=>moveInd());if(document.fonts&&document.fonts.ready)document.fonts.ready.then(moveInd);
  tickClocks();setInterval(tickClocks,1000);
  try{const l=localStorage.getItem('stigen:life');if(l)S.lifeSec=l}catch(e){}}

/* ================= v11: sound packs, celebrations, backgrounds ================= */
function FXC(){S.cfg.fx=S.cfg.fx||{};const f=S.cfg.fx;if(!f.sound)f.sound=S.cfg.flags.mute?'none':'titanium';if(!f.cel)f.cel=S.cfg.flags.noconfetti?'none':'confetti';if(!f.bg)f.bg='aurora';return f}
function SOUND_PACKS(){return [['titanium',T('Titanium keys','Titantangenter')],['typewriter',T('Typewriter','Skrivmaskin')],['soft',T('Soft taps','Mjuka tryck')],['glass',T('Glass','Glas')],['bubble',T('Bubbles','Bubblor')],['classic',T('Classic','Klassisk')],['none',T('Off','Av')]]}
function CELEBRATIONS(){return [['confetti',T('Confetti','Konfetti')],['fireworks',T('Fireworks','Fyrverkeri')],['stars',T('Stars','Stjärnor')],['bubbles',T('Bubbles','Bubblor')],['rings',T('Shockwave','Tryckvåg')],['sparkle',T('Sparkle','Gnistor')],['none',T('Off','Av')]]}
function BACKGROUNDS(){return [['aurora',T('Aurora','Norrsken')],['mesh',T('Colour mesh','Färgmesh')],['grain',T('Film grain','Filmkorn')],['grid',T('Blueprint','Ritning')],['topo',T('Topography','Höjdkurvor')],['stars',T('Night sky','Natthimmel')],['dots',T('Dots','Prickar')],['plain',T('Plain','Enfärgad')]]}
/* mechanical / material sound synthesis */
function nburst(ac,t0,dur,{vol=.08,type='bandpass',f=3000,q=1.2,decay=dur}={}){const n=Math.max(1,Math.floor(ac.sampleRate*dur));const b=ac.createBuffer(1,n,ac.sampleRate);const d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);
  const s=ac.createBufferSource();s.buffer=b;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=ac.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+decay);s.connect(fl);fl.connect(g);g.connect(ac.destination);s.start(t0)}
function osc(ac,t0,f,dur,{type='sine',vol=.06,slide=0,attack=.002}={}){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t0+dur);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+attack);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+dur+.03)}
const jit=(v,p=.06)=>v*(1+(Math.random()*2-1)*p);
const PACK={
  titanium:{key(ac,t){nburst(ac,t,.012,{f:jit(4200),q:2.5,vol:.11});nburst(ac,t+.004,.045,{type:'lowpass',f:jit(700),q:.8,vol:.16,decay:.05});osc(ac,t+.003,jit(185),.05,{vol:.05,slide:.7})},
    down(ac,t){nburst(ac,t,.03,{type:'lowpass',f:jit(520),vol:.14});osc(ac,t,jit(150),.04,{vol:.04,slide:.6})},
    up(ac,t){PACK.titanium.key(ac,t);osc(ac,t+.02,jit(2600),.07,{type:'triangle',vol:.025})}},
  typewriter:{key(ac,t){nburst(ac,t,.018,{f:jit(2600),q:3,vol:.14});osc(ac,t,jit(1900),.03,{type:'square',vol:.012});nburst(ac,t+.012,.04,{type:'lowpass',f:jit(380),vol:.12})},
    down(ac,t){nburst(ac,t,.03,{type:'lowpass',f:300,vol:.12})},
    up(ac,t){PACK.typewriter.key(ac,t);osc(ac,t+.06,2093,.6,{vol:.05});osc(ac,t+.06,4186,.4,{vol:.015})}},
  soft:{key(ac,t){nburst(ac,t,.02,{type:'lowpass',f:jit(900),vol:.07})},down(ac,t){nburst(ac,t,.02,{type:'lowpass',f:500,vol:.05})},up(ac,t){osc(ac,t,jit(660),.12,{vol:.05});osc(ac,t+.05,jit(990),.14,{vol:.035})}},
  glass:{key(ac,t){osc(ac,t,jit(2400,.02),.12,{vol:.04});osc(ac,t,jit(3600,.02),.08,{vol:.015})},down(ac,t){osc(ac,t,1500,.1,{vol:.03,slide:.8})},up(ac,t){[2093,2637,3136].forEach((f,i)=>osc(ac,t+i*.05,f,.35,{vol:.035}))}},
  bubble:{key(ac,t){osc(ac,t,jit(420),.08,{vol:.07,slide:2.4})},down(ac,t){osc(ac,t,520,.08,{vol:.05,slide:.5})},up(ac,t){osc(ac,t,380,.1,{vol:.07,slide:2.6});osc(ac,t+.07,620,.1,{vol:.06,slide:2.4})}},
  classic:{key(ac,t){osc(ac,t,880,.035,{vol:.025})},down(ac,t){osc(ac,t,660,.07,{type:'triangle',vol:.04,slide:.7})},up(ac,t){osc(ac,t,1320,.06,{type:'triangle',vol:.06});osc(ac,t+.03,1980,.05,{vol:.03})}}
};
function sfx(k){const f=S.cfg?FXC():{sound:'titanium'};if(f.sound==='none')return;const ac=audio();if(!ac)return;const t=ac.currentTime+.005;const P=PACK[f.sound]||PACK.titanium;
  try{switch(k){
    case 'key':case 'click':case 'tab':case 'nope':P.key(ac,t);if(k==='nope')P.down(ac,t+.08);break;
    case 'tick':case 'pop':case 'coin':P.up(ac,t);break;
    case 'untick':P.down(ac,t);break;
    case 'done':P.up(ac,t);[523,659,784].forEach((x,i)=>osc(ac,t+.05+i*.06,x,.22,{type:'triangle',vol:.04}));break;
    case 'chord':P.up(ac,t);[523,659,784,1047].forEach((x,i)=>osc(ac,t+.05+i*.07,x,.9,{vol:.045}));break;
    case 'level':[392,523,659,784,1047].forEach((x,i)=>osc(ac,t+i*.08,x,.35,{type:'triangle',vol:.05}));break;
    case 'whoosh':nburst(ac,t,.35,{type:'bandpass',f:600,q:.6,vol:.05});break;
    case 'seal':osc(ac,t,180,.25,{vol:.12,slide:.5});nburst(ac,t,.08,{type:'highpass',f:1200,vol:.04});break;
  }}catch(e){}}
/* celebrations */
function celColors(){return fxColors()}
function spawn(kind,x,y,n,power){const C=celColors();const P=FX.parts;const R=Math.random;
  for(let i=0;i<n;i++){const a=R()*Math.PI*2;const c=C[i%C.length];
    if(kind==='confetti'){const sp=(2+R()*6)*power;P.push({k:'c',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3*power,g:.22,r:R()*Math.PI,vr:(R()-.5)*.3,w:4+R()*5,h:6+R()*8,c,life:60+R()*40,round:R()<.3})}
    else if(kind==='fireworks'){const sp=(3+R()*5)*power;P.push({k:'s',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:.05,drag:.97,c,life:50+R()*30,w:2.2})}
    else if(kind==='stars'){const sp=(1.5+R()*5)*power;P.push({k:'star',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2*power,g:.12,r:R()*6,vr:(R()-.5)*.2,w:5+R()*7,c,life:60+R()*40})}
    else if(kind==='bubbles'){P.push({k:'b',x:x+(R()-.5)*60*power,y,vx:(R()-.5)*1.2,vy:-(1+R()*3)*power,g:-.01,c,life:80+R()*60,w:4+R()*10,ph:R()*6})}
    else if(kind==='sparkle'){const d=R()*80*power;P.push({k:'sp',x:x+Math.cos(a)*d,y:y+Math.sin(a)*d,vx:0,vy:-.3,g:0,c,life:30+R()*40,w:2+R()*4,ph:R()*6})}
  }
  if(kind==='rings'){for(let i=0;i<3;i++)P.push({k:'ring',x,y,vx:0,vy:0,g:0,c:C[i%C.length],life:55,max:55,delay:i*7,w:40+60*power})}
  loopFx()}
function burst(x,y,n=24,power=1){if(FX.reduce||!S.cfg)return;const k=FXC().cel;if(k==='none'||!fxCanvas())return;spawn(k,x,y,k==='rings'?1:n,power)}
function rain(){if(FX.reduce||!S.cfg)return;const k=FXC().cel;if(k==='none'||!fxCanvas())return;const W=innerWidth,H=innerHeight,R=Math.random;
  if(k==='confetti'){const C=celColors();for(let i=0;i<160;i++)FX.parts.push({k:'c',x:R()*W,y:-20-R()*H*.5,vx:(R()-.5)*2,vy:2+R()*3,g:.05,r:R()*6,vr:(R()-.5)*.25,w:5+R()*5,h:8+R()*10,c:C[i%C.length],life:200+R()*80,round:R()<.25,sway:1});spawn('confetti',W*.15,H*.85,40,1.6);spawn('confetti',W*.85,H*.85,40,1.6);return}
  if(k==='fireworks'){for(let i=0;i<5;i++)setTimeout(()=>{spawn('fireworks',W*(.2+R()*.6),H*(.2+R()*.35),70,1.2);sfx('whoosh')},i*260);return}
  if(k==='stars'){for(let i=0;i<4;i++)setTimeout(()=>spawn('stars',W*(.2+R()*.6),H*(.3+R()*.3),40,1.4),i*180);return}
  if(k==='bubbles'){for(let i=0;i<10;i++)setTimeout(()=>spawn('bubbles',W*R(),H+10,12,1.8),i*90);return}
  if(k==='rings'){spawn('rings',W/2,H/2,1,4);setTimeout(()=>spawn('rings',W/2,H/2,1,6),250);return}
  if(k==='sparkle'){for(let i=0;i<6;i++)setTimeout(()=>spawn('sparkle',W*R(),H*R(),30,2),i*120);return}}
function starPath(x,r){x.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2;const rr=i%2?r*.45:r;x.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}x.closePath()}
function loopFx(){if(FX.raf)return;const step=()=>{const x=FX.cx;x.clearRect(0,0,innerWidth,innerHeight);FX.parts=FX.parts.filter(p=>p.life>0&&p.y<innerHeight+60&&p.y>-200);
  FX.parts.forEach(p=>{if(p.delay>0){p.delay--;return}const ox=p.x,oy=p.y;p.vy+=p.g;if(p.drag){p.vx*=p.drag;p.vy*=p.drag}else p.vx*=.99;p.x+=p.vx+(p.sway?Math.sin(p.life/12)*.6:0)+(p.k==='b'?Math.sin((p.life+p.ph*10)/10)*.5:0);p.y+=p.vy;if(p.vr)p.r+=p.vr;p.life--;
    x.save();const al=Math.min(1,p.life/30);x.globalAlpha=al;x.fillStyle=p.c;x.strokeStyle=p.c;
    if(p.k==='c'){x.translate(p.x,p.y);x.rotate(p.r);if(p.round){x.beginPath();x.arc(0,0,p.w/2,0,7);x.fill()}else{x.scale(1,Math.cos(p.life/6));x.fillRect(-p.w/2,-p.h/2,p.w,p.h)}}
    else if(p.k==='s'){x.lineWidth=p.w;x.lineCap='round';x.beginPath();x.moveTo(ox-p.vx*3,oy-p.vy*3);x.lineTo(p.x,p.y);x.stroke();x.globalAlpha=al*.6;x.beginPath();x.arc(p.x,p.y,p.w*1.4,0,7);x.fill()}
    else if(p.k==='star'){x.translate(p.x,p.y);x.rotate(p.r);starPath(x,p.w);x.fill()}
    else if(p.k==='b'){x.globalAlpha=al*.7;x.lineWidth=1.5;x.beginPath();x.arc(p.x,p.y,p.w,0,7);x.stroke();x.globalAlpha=al*.35;x.beginPath();x.arc(p.x-p.w*.35,p.y-p.w*.35,p.w*.25,0,7);x.fill()}
    else if(p.k==='sp'){const s=p.w*(.6+.4*Math.sin(p.life/4+p.ph));x.translate(p.x,p.y);x.beginPath();x.moveTo(0,-s*2);x.lineTo(s*.4,0);x.lineTo(0,s*2);x.lineTo(-s*.4,0);x.closePath();x.fill();x.beginPath();x.moveTo(-s*2,0);x.lineTo(0,s*.4);x.lineTo(s*2,0);x.lineTo(0,-s*.4);x.closePath();x.fill()}
    else if(p.k==='ring'){const k=1-p.life/p.max;x.globalAlpha=(1-k)*.8;x.lineWidth=3*(1-k)+.5;x.beginPath();x.arc(p.x,p.y,8+k*p.w*3,0,7);x.stroke()}
    x.restore()});
  if(FX.parts.length)FX.raf=requestAnimationFrame(step);else{FX.raf=0;x.clearRect(0,0,innerWidth,innerHeight)}};FX.raf=requestAnimationFrame(step)}
/* backgrounds */
function applyBg(){if(!S.cfg)return;document.documentElement.dataset.bg=FXC().bg}
function feelFields(){const f=FXC();const chips=(L,cur,sa)=>`<div class="chips">${L.map(([k,l])=>`<button type="button" data-sa="${sa}" data-v="${k}" aria-pressed="${cur===k}">${l}</button>`).join('')}</div>`;
  return `<div class="field"><span class="lbl">${T('Click sound','Klickljud')}</span>${chips(SOUND_PACKS(),f.sound,'x-snd')}</div>
  <div class="field"><span class="lbl">${T('Celebration','Firande')}</span>${chips(CELEBRATIONS(),f.cel,'x-cel')}</div>
  <div class="field"><span class="lbl">${T('Background','Bakgrund')}</span><div class="bgpick">${BACKGROUNDS().map(([k,l])=>`<button type="button" class="bgsw" data-sa="x-bg" data-v="${k}" aria-pressed="${f.bg===k}"><i data-bgp="${k}"></i><span>${l}</span></button>`).join('')}</div></div>`}
function xSheetClick2(a,b,c,e){const v=b.dataset.v;const set=sa=>sheet.querySelectorAll(`[data-sa="${sa}"]`).forEach(x=>x.setAttribute('aria-pressed',x===b));
  if(a==='x-snd'){FXC().sound=v;S.cfg.flags.mute=v==='none';saveCfg();set('x-snd');setTimeout(()=>sfx('tick'),10);return}
  if(a==='x-cel'){FXC().cel=v;S.cfg.flags.noconfetti=v==='none';saveCfg();set('x-cel');const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top,40,1.2);return}
  if(a==='x-bg'){FXC().bg=v;saveCfg();set('x-bg');applyBg();return}}
/* only today and past days can be checked off */
function isFuture(d){return d&&dkey(d)>dkey(today())}
/* ================= boot ================= */
function afterConfig(){if(S.cfg.lang)setLang(S.cfg.lang);applyAccent();fxPrefs();applyBg()}
function gate(){if(document.getElementById('iv'))return;if(!S.cfg.lang){showLanguage();return}if(needInterview())startInterview()}
initFx();S.cfg=normCfg(Store.lsGet('config')||seedExample());afterConfig();setView(S.view);render(true);
(async function connect(){
  try{
    if(!window.claude||!window.claude.use){S.caps.downloads=LOCAL_DL;render(false);await initCloud();gate();return}
    const [db,user,sample,downloads,mcp,assets]=await Promise.all(['db','user','sample','downloads','mcp','assets'].map(n=>window.claude.use(n).catch(()=>null)));S.caps={sample,downloads,user,mcp,assets};
    if(user){try{const me=await user.me();S.meName=(me&&me.name)||''}catch(e){}}
    if(db&&user){const id=await user.id();if(id){S.meId=id;Store.col=db.collection('data/users/'+id);const snap=await Store.col.doc('config').get();
      if(snap.exists){Store.migrate=false;S.cfg=normCfg(clone(snap.data()));Store.lsSet('config',S.cfg)}else{Store.migrate=true;Store.save('config',S.cfg)}
      setSync('ok');S.loaded=new Set();try{initShared(db,user)}catch(e){}try{initBuddy(db,user)}catch(e){}}}
    afterConfig();closePop();if(!sheet&&!IV)render(false);gate();
  }catch(e){setSync(Store.col?'err':'local');gate()}
})();
})();

</script>
